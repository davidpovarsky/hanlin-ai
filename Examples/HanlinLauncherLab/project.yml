name: HanlinLauncherLab
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  HanlinSDK:
    path: ../..
targets:
  HanlinLauncherLab:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - Sources
    dependencies:
      - package: HanlinSDK
        product: HanlinChatPresentation
      - package: HanlinSDK
        product: HanlinPresentationKit
      - package: HanlinSDK
        product: HanlinChatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidpovarsky.HanlinLauncherLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hanlin Launcher Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
