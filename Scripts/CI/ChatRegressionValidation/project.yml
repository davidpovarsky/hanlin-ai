name: HanlinChatRegression
options:
  bundleIdPrefix: com.hanlin.validation
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  HanlinPresentationSDK:
    path: ../../../Packages/HanlinPresentationSDK
targets:
  ChatRegressionHost:
    type: application
    platform: iOS
    sources:
      - path: ProbeHostApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanlin.validation.chat-regression
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  Hanlin145801ComposerBaseline:
    type: framework
    platform: iOS
    sources:
      - path: Baseline/HanlinMorphComposer.swift
    dependencies:
      - package: HanlinPresentationSDK
        product: HanlinPresentationKit
  ChatRegressionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ChatRegressionHost
      - target: Hanlin145801ComposerBaseline
      - package: HanlinPresentationSDK
        product: HanlinChatUI
    settings:
      base:
        ENABLE_TESTABILITY: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChatRegressionHost.app/ChatRegressionHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HanlinChatRegression:
    build:
      targets:
        ChatRegressionHost: all
        ChatRegressionTests: [test]
    test:
      targets:
        - ChatRegressionTests
      gatherCoverageData: false
