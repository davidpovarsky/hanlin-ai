name: Validate Expo Runtime Spike

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-expo-runtime:
    name: Compile and test Hanlin Expo runtime on macOS
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      PROJECT_PATH: AI_HLY.xcodeproj
      SCHEME_NAME: AI_HLY
      CONFIGURATION: Debug
      DERIVED_DATA_PATH: build/DerivedData
      CLONED_PACKAGES_PATH: build/SourcePackages
      LOG_DIR: build-logs
      IOS_DEPLOYMENT_TARGET: "27.0"

    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Select stable Xcode 27
        id: toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$LOG_DIR" build
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' -print \
            | grep -E '/Xcode_27([._][0-9]+)*\.app$' \
            | sort -V \
            | tail -1)"
          test -n "$selected_xcode"
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          xcodebuild -version | tee "$LOG_DIR/01-xcode-version.log"
          swift --version | tee -a "$LOG_DIR/01-xcode-version.log"
          xcrun --sdk iphonesimulator --show-sdk-version | tee "$LOG_DIR/01-sdk-version.log"
          xcodebuild -showsdks | grep -E 'iphonesimulator27|iOS Simulator 27'

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Install Expo tooling dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm ci --prefix Scripts/Expo

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Prepare Expo iOS dependency closure
        shell: bash
        run: |
          set -euxo pipefail
          node Scripts/Expo/prepare-ios-dependencies.mjs 2>&1 | tee "$LOG_DIR/02-expo-dependencies.log"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Prepare verified embedded RuntimeCore & host resources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          bash Scripts/Runtime/prepare-runtime-core.sh 2>&1 | tee "$LOG_DIR/03-prepare-runtime-core.log"
          bash Scripts/Runtime/prepare-runtime-host.sh 2>&1 | tee "$LOG_DIR/03-package-runtime-host.log"
          cp build/runtime-host/RuntimeHostResources.zip AI_HLY/RuntimeHostResources.zip

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Create CI Config.xcconfig
        shell: bash
        run: |
          set -euxo pipefail
          cat > Config.xcconfig <<'EOF'
          // Generated by GitHub Actions for CI builds.
          // Do not commit secrets here.

          HANLIN_API_KEY =
          HANLIN_OPEN_API_KEY =
          EOF

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Prepare NativeScript binary dependencies for package resolution
        shell: bash
        run: |
          set -euxo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix Scripts/NativeScript
          npm run prepare:ios-dependencies --prefix Scripts/NativeScript

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Prepare HanlinExpoNativeAPI iOS dependencies and artifacts
        shell: bash
        run: |
          set -euxo pipefail
          node Scripts/ExpoNativeAPI/prepare-ios-dependencies.mjs 2>&1 | tee "$LOG_DIR/03-prepare-nativeapi-dependencies.log"
          node Scripts/ExpoNativeAPI/verify-artifacts.mjs 2>&1 | tee "$LOG_DIR/03-verify-nativeapi-artifacts.log"
          node Scripts/ExpoNativeAPI/verify-nsmd.mjs 2>&1 | tee "$LOG_DIR/03-verify-nsmd.log"
          node Scripts/ExpoNativeAPI/preflight.mjs 2>&1 | tee "$LOG_DIR/03-nativeapi-preflight.log"
          node --test Scripts/ExpoNativeAPI/Tests/*.test.mjs 2>&1 | tee "$LOG_DIR/03-nativeapi-static-tests.log"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Verify HanlinExpoRuntime package resolution
        shell: bash
        run: |
          set -euxo pipefail
          swift package --package-path Packages/HanlinExpoNativeAPI resolve
          swift package --package-path Packages/HanlinExpoRuntime resolve

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Run focused HanlinScriptAnalyzerTests
        shell: bash
        run: |
          set -euxo pipefail
          swift test --package-path Packages/HanlinPlatform --filter HanlinScriptAnalyzerTests \
            2>&1 | tee "$LOG_DIR/04-analyzer-tests.log"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Resolve Swift Package dependencies
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt: resolving package dependencies..."
            if xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -resolvePackageDependencies \
              -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              2>&1 | tee "$LOG_DIR/04-resolve-packages.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve package dependencies after 3 attempts."
              exit 74
            fi
            echo "Retrying after cleaning SPM repository cache..."
            rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/* || true
            sleep 5
          done

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build Hanlin application for testing
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:AI_HLYUITests \
            ENABLE_TESTABILITY=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            | tee "$LOG_DIR/05-build-for-testing.log"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Boot iPad Simulator and stage fixtures
        id: stage-fixtures
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -name 'AI_Hanlin.app' | head -1)"
          test -d "$APP_PATH"
          echo "Found app bundle at $APP_PATH"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "App bundle identifier: $BUNDLE_ID"

          selection="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS-27" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPad" in device.get("name", ""):
                      is_mini = 1 if "mini" in device.get("name", "") else 0
                      candidates.append((is_mini, runtime, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iOS 27 iPad simulator was found")
          candidates.sort(reverse=True)
          _, runtime, name, udid = candidates[0]
          print(f"{udid}\t{name}\t{runtime}")
          PY
          )"
          IFS=$'\t' read -r SIMULATOR_UDID SIMULATOR_MODEL SIMULATOR_RUNTIME <<< "$selection"
          test -n "$SIMULATOR_UDID"
          echo "Selected simulator: $SIMULATOR_MODEL ($SIMULATOR_UDID) running $SIMULATOR_RUNTIME"
          echo "$SIMULATOR_UDID" > "$LOG_DIR/simulator-udid.txt"

          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>&1 | tee "$LOG_DIR/06-bootstatus.log"

          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

          # Bounded fixture staging for app container and optional DocumentsApp (Files)
          python3 - "$SIMULATOR_UDID" "$BUNDLE_ID" <<'PY'
          import subprocess
          import sys
          import shutil
          import glob
          import os
          from pathlib import Path

          sim_udid = sys.argv[1]
          bundle_id = sys.argv[2]
          fixtures = glob.glob("AI_HLYUITests/Fixtures/*.hanlinExpo")
          if not fixtures:
              print("Warning: No .hanlinExpo fixtures found in AI_HLYUITests/Fixtures")
              sys.exit(0)

          def find_container_dir(sim_id, target_bundle_id):
              # Try simctl first with 10s timeout
              try:
                  res = subprocess.run(
                      ["xcrun", "simctl", "get_app_container", sim_id, target_bundle_id, "data"],
                      capture_output=True,
                      text=True,
                      timeout=10,
                  )
                  if res.returncode == 0 and res.stdout.strip():
                      p = Path(res.stdout.strip())
                      if p.exists():
                          return p
              except Exception as e:
                  print(f"simctl lookup for {target_bundle_id} failed: {e}")

              # Fallback: scan CoreSimulator container metadata on disk directly
              base = Path.home() / "Library/Developer/CoreSimulator/Devices" / sim_id / "data/Containers/Data/Application"
              if base.exists():
                  for c in base.iterdir():
                      meta = c / ".com.apple.mobile_container_manager.metadata.plist"
                      if meta.exists():
                          try:
                              with open(meta, "rb") as mf:
                                  if target_bundle_id.encode() in mf.read():
                                      return c
                          except Exception:
                              pass
              return None

          # 1. App container
          app_container = find_container_dir(sim_udid, bundle_id)
          if app_container:
              docs = app_container / "Documents"
              docs.mkdir(parents=True, exist_ok=True)
              for f in fixtures:
                  shutil.copy2(f, docs / Path(f).name)
              print(f"Staged {len(fixtures)} fixtures into app Documents: {docs}")
          else:
              print(f"Warning: Could not locate app container for {bundle_id}")

          # 2. DocumentsApp (Files) container
          files_container = find_container_dir(sim_udid, "com.apple.DocumentsApp")
          if files_container:
              docs = files_container / "Documents"
              docs.mkdir(parents=True, exist_ok=True)
              for f in fixtures:
                  shutil.copy2(f, docs / Path(f).name)
              print(f"Staged {len(fixtures)} fixtures into Files Documents: {docs}")
          else:
              print("Files container not found (optional staging skipped)")
          PY

          echo "sim-udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Run Expo SwiftUI Production E2E Tests
        shell: bash
        run: |
          set -euxo pipefail
          SIMULATOR_UDID="$(cat "$LOG_DIR/simulator-udid.txt")"
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testProductionExpoSwiftUIProbeEndToEnd \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testProductionExpoDynamicPackageSwitching \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testProductionExpoLifecycleAndUninstall \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIMountAndInteraction \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIDynamicVariantSwitching \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIIncompatibleVersionRejection \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIMalformedPackageRejection \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIDeniedPersistedGrant \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIRevokeWhileMounted \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIRepeatedLifecycle \
            -resultBundlePath "build/ExpoE2EResults.xcresult" \
            2>&1 | tee "$LOG_DIR/07-expo-e2e-tests.log"

      - name: Diagnostic logs and crash reports
        if: always()
        shell: bash
        run: |
          set +e
          SIMULATOR_UDID="$(cat "$LOG_DIR/simulator-udid.txt" 2>/dev/null || true)"
          echo "=== DIAGNOSTIC REPORTS / CRASH REPORTS ==="
          find ~/Library/Logs/DiagnosticReports -type f | while read -r f; do
            echo "--- $f ---"
            cat "$f"
          done
          if [ -n "$SIMULATOR_UDID" ]; then
            echo "=== SIMULATOR APP LOGS (LAST 100 LINES) ==="
            python3 - "$SIMULATOR_UDID" "$LOG_DIR/08-ai-hanlin-simulator.log" <<'PY' || true
import subprocess, sys
udid, logfile = sys.argv[1], sys.argv[2]
try:
    with open(logfile, "w") as out:
        subprocess.run(
            ["xcrun", "simctl", "spawn", udid, "log", "show", "--style", "compact", "--last", "5m", "--predicate", 'process == "AI_Hanlin"'],
            stdout=out,
            stderr=subprocess.STDOUT,
            timeout=30,
        )
except Exception as e:
    print(f"Log show timed out or failed: {e}", file=sys.stderr)
PY
            tail -n 100 "$LOG_DIR/08-ai-hanlin-simulator.log" || true
          fi

      - name: Live Activity · refresh
        if: always()
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload Test Results and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-runtime-spike-results
          path: |
            build-logs/
            build/*.xcresult
