name: Validate Expo Runtime Spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-expo-runtime:
    name: Compile and test Hanlin Expo runtime on macOS
    runs-on: macos-26
    timeout-minutes: 60

    env:
      PROJECT_PATH: AI_HLY.xcodeproj
      SCHEME_NAME: AI_HLY
      CONFIGURATION: Debug
      DERIVED_DATA_PATH: build/DerivedData
      CLONED_PACKAGES_PATH: build/SourcePackages
      LOG_DIR: build-logs
      IOS_DEPLOYMENT_TARGET: "26.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select stable Xcode 26
        id: toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$LOG_DIR" build
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print \
            | grep -E '/Xcode_26([._][0-9]+)*\.app$' \
            | sort -V \
            | tail -1)"
          test -n "$selected_xcode"
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          xcodebuild -version | tee "$LOG_DIR/01-xcode-version.log"
          swift --version | tee -a "$LOG_DIR/01-xcode-version.log"
          xcrun --sdk iphonesimulator --show-sdk-version | tee "$LOG_DIR/01-sdk-version.log"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Expo tooling dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm ci --prefix Scripts/Expo

      - name: Prepare Expo iOS dependency closure
        shell: bash
        run: |
          set -euxo pipefail
          node Scripts/Expo/prepare-ios-dependencies.mjs 2>&1 | tee "$LOG_DIR/02-expo-dependencies.log"

      - name: Prepare verified embedded RuntimeCore & host resources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          bash Scripts/Runtime/prepare-runtime-core.sh 2>&1 | tee "$LOG_DIR/03-prepare-runtime-core.log"
          bash Scripts/Runtime/prepare-runtime-host.sh 2>&1 | tee "$LOG_DIR/03-package-runtime-host.log"
          cp build/runtime-host/RuntimeHostResources.zip AI_HLY/RuntimeHostResources.zip

      - name: Create CI Config.xcconfig
        shell: bash
        run: |
          set -euxo pipefail
          cat > Config.xcconfig <<'EOF'
          // Generated by GitHub Actions for CI builds.
          // Do not commit secrets here.

          HANLIN_API_KEY =
          HANLIN_OPEN_API_KEY =
          EOF

      - name: Prepare NativeScript binary dependencies for package resolution
        shell: bash
        run: |
          set -euxo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix Scripts/NativeScript
          npm run prepare:ios-dependencies --prefix Scripts/NativeScript

      - name: Verify HanlinExpoRuntime package resolution
        shell: bash
        run: |
          set -euxo pipefail
          swift package --package-path Packages/HanlinExpoRuntime resolve

      - name: Resolve Swift Package dependencies
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee "$LOG_DIR/04-resolve-packages.log"

      - name: Build Hanlin application for testing
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:AI_HLYUITests \
            ENABLE_TESTABILITY=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            | tee "$LOG_DIR/05-build-for-testing.log"

      - name: Boot iPad Simulator and stage fixtures
        id: stage-fixtures
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -name 'AI_Hanlin.app' | head -1)"
          test -d "$APP_PATH"
          echo "Found app bundle at $APP_PATH"

          # Strip embedded unit test bundles and testing frameworks from the product app
          rm -rf "$APP_PATH/PlugIns/AI_HLYTests.xctest"
          rm -rf "$APP_PATH/PlugIns/AI_HLYUITests.xctest"
          rm -rf "$APP_PATH/Frameworks/XC"*
          rm -rf "$APP_PATH/Frameworks/libXCTest"*
          rm -rf "$APP_PATH/Frameworks/Testing.framework"
          rm -rf "$APP_PATH/Frameworks/lib_Testing"*

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "App bundle identifier: $BUNDLE_ID"

          selection="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS-26" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPad" in device.get("name", ""):
                      candidates.append((runtime, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iOS 26 iPad simulator was found")
          runtime, name, udid = sorted(candidates, reverse=True)[0]
          print(f"{udid}\t{name}\t{runtime}")
          PY
          )"
          IFS=$'\t' read -r SIMULATOR_UDID SIMULATOR_MODEL SIMULATOR_RUNTIME <<< "$selection"
          test -n "$SIMULATOR_UDID"
          echo "Selected simulator: $SIMULATOR_MODEL ($SIMULATOR_UDID) running $SIMULATOR_RUNTIME"
          echo "$SIMULATOR_UDID" > "$LOG_DIR/simulator-udid.txt"

          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>&1 | tee "$LOG_DIR/06-bootstatus.log"

          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

          APP_CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$BUNDLE_ID" data 2>/dev/null || true)"
          if [ -n "$APP_CONTAINER" ]; then
            mkdir -p "$APP_CONTAINER/Documents"
            cp AI_HLYUITests/Fixtures/*.hanlinExpo "$APP_CONTAINER/Documents/"
            ls -la "$APP_CONTAINER/Documents"
          fi

          FILES_CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.apple.DocumentsApp data 2>/dev/null || true)"
          if [ -n "$FILES_CONTAINER" ]; then
            mkdir -p "$FILES_CONTAINER/Documents"
            cp AI_HLYUITests/Fixtures/*.hanlinExpo "$FILES_CONTAINER/Documents/"
            ls -la "$FILES_CONTAINER/Documents"
          fi

          echo "sim-udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Run Expo SwiftUI Production E2E Tests
        shell: bash
        run: |
          set -euxo pipefail
          SIMULATOR_UDID="$(cat "$LOG_DIR/simulator-udid.txt")"
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testProductionExpoSwiftUIProbeEndToEnd \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testProductionExpoDynamicPackageSwitching \
            -resultBundlePath "build/ExpoE2EResults.xcresult" \
            2>&1 | tee "$LOG_DIR/07-expo-e2e-tests.log"

      - name: Upload Test Results and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-runtime-spike-results
          path: |
            build-logs/
            build/*.xcresult
