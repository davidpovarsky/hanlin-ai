name: Validate Expo Runtime Spike

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Focused widget package verification or the existing app/simulator validation
        type: choice
        default: full
        options: [full, widget-package, widget-native-subset]

permissions:
  actions: read
  contents: read

jobs:
  validate-widget-native-subset:
    if: inputs.validation_scope == 'widget-native-subset'
    name: Compile and link source-only Expo widget subset
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile against the real iOS Simulator SDK with extension enforcement
        shell: bash
        run: |
          set -euo pipefail
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' -print | grep -E '/Xcode_27([._][0-9]+)*\.app$' | sort -V | tail -1)"
          export DEVELOPER_DIR="$selected_xcode/Contents/Developer"
          mkdir -p build-logs/widget-native-subset build/widget-native-subset
          xcodebuild -version | tee build-logs/widget-native-subset/toolchain.log
          xcrun swiftc --version | tee -a build-logs/widget-native-subset/toolchain.log
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          sources=()
          while IFS= read -r -d '' source; do sources+=("$source"); done < <(find Packages/HanlinExpoWidgetSubset/Sources -name '*.swift' -print0)
          xcrun swiftc -emit-library -emit-module -parse-as-library -module-name HanlinExpoWidgetSubset \
            -swift-version 5 -application-extension -sdk "$sdk" -target arm64-apple-ios27.0-simulator \
            "${sources[@]}" -o build/widget-native-subset/libHanlinExpoWidgetSubset.dylib \
            2>&1 | tee build-logs/widget-native-subset/compiler.log
          native_sources=()
          while IFS= read -r -d '' source; do native_sources+=("$source"); done < <(find Packages/HanlinExpoRuntime/Sources/HanlinExpoWidgetNative -name '*.swift' -print0)
          xcrun swiftc -emit-library -emit-module -parse-as-library -module-name HanlinExpoWidgetNative \
            -swift-version 6 -application-extension -sdk "$sdk" -target arm64-apple-ios27.0-simulator \
            -I build/widget-native-subset -L build/widget-native-subset -lHanlinExpoWidgetSubset \
            "${native_sources[@]}" -o build/widget-native-subset/libHanlinExpoWidgetNative.dylib \
            2>&1 | tee build-logs/widget-native-subset/native-renderer-compiler.log
          otool -L build/widget-native-subset/libHanlinExpoWidgetSubset.dylib | tee build-logs/widget-native-subset/otool.log
          otool -hv build/widget-native-subset/libHanlinExpoWidgetSubset.dylib | tee build-logs/widget-native-subset/mach-header.log
          shasum -a 256 build/widget-native-subset/libHanlinExpoWidgetSubset.dylib | tee build-logs/widget-native-subset/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-native-subset-${{ github.run_id }}
          path: |
            build-logs/widget-native-subset
            build/widget-native-subset
          retention-days: 14
  validate-widget-package:
    if: inputs.validation_scope == 'widget-package'
    name: Compile widget source and execute package regression tests
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      HANLIN_WIDGET_EVIDENCE_DIR: ${{ github.workspace }}/build-logs/widgets/rendered
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.5.0
      - name: Select stable SDK without changing the runner default
        id: widget-toolchain
        shell: bash
        run: |
          set -euo pipefail
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' -print | grep -E '/Xcode_27([._][0-9]+)*\.app$' | sort -V | tail -1)"
          test -n "$selected_xcode"
          echo "DEVELOPER_DIR=$selected_xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "build=$(DEVELOPER_DIR="$selected_xcode/Contents/Developer" xcodebuild -version | sed -n '2s/^Build version //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: widget-spm-cache
        with:
          path: Packages/HanlinPlatform/.build
          key: widget-spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.widget-toolchain.outputs.build }}-${{ hashFiles('Packages/HanlinPlatform/Package.resolved') }}
          restore-keys: widget-spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.widget-toolchain.outputs.build }}-
      - name: Compiler and fixture semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/widgets
          xcodebuild -version | tee build-logs/widgets/toolchain.log
          swift --version | tee -a build-logs/widgets/toolchain.log
          node --test Scripts/Widgets/Tests/compiler-and-actions.test.mjs 2>&1 | tee build-logs/widgets/javascript-tests.log
      - name: Focused widget and affected importer regressions
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/HanlinPlatform --filter 'HanlinDualWidgetEnginesTests|HanlinOriginalScriptWidgetRenderingTests|HanlinScriptExtensionStoreTests|HanlinScriptAnalyzerTests' 2>&1 | tee build-logs/widgets/package-tests.log
      - uses: actions/cache/save@v4
        if: success() && steps.widget-spm-cache.outputs.cache-hit != 'true'
        with:
          path: Packages/HanlinPlatform/.build
          key: ${{ steps.widget-spm-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-package-evidence-${{ github.run_id }}
          path: build-logs/widgets
          retention-days: 14
  validate-expo-runtime:
    if: inputs.validation_scope == 'full'
    name: Compile and test Hanlin Expo runtime on macOS
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      PROJECT_PATH: AI_HLY.xcodeproj
      SCHEME_NAME: AI_HLY
      CONFIGURATION: Debug
      DERIVED_DATA_PATH: build/DerivedData
      CLONED_PACKAGES_PATH: build/SourcePackages
      LOG_DIR: build-logs
      IOS_DEPLOYMENT_TARGET: "27.0"

    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Select stable Xcode 27
        id: toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$LOG_DIR" build
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' -print \
            | grep -E '/Xcode_27([._][0-9]+)*\.app$' \
            | sort -V \
            | tail -1)"
          test -n "$selected_xcode"
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          xcodebuild -version | tee "$LOG_DIR/01-xcode-version.log"
          swift --version | tee -a "$LOG_DIR/01-xcode-version.log"
          xcrun --sdk iphonesimulator --show-sdk-version | tee "$LOG_DIR/01-sdk-version.log"
          xcodebuild -showsdks | grep -E 'iphonesimulator27|iOS Simulator 27'

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Install Expo tooling dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm ci --prefix Scripts/Expo

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Bundle native Searchable regression probe and widget samples
        shell: bash
        run: |
          set -euxo pipefail
          npm run build:probe --prefix Scripts/Expo
          node Scripts/Widgets/build-sample-packages.mjs
          test -s AI_HLYUITests/Fixtures/ExpoSwiftUIProbeA.hanlinExpo
          test -s AI_HLYUITests/Fixtures/ExpoSwiftUIProbeB.hanlinExpo
          test -s AI_HLYUITests/Fixtures/Hanlin-Expo-Widget-Counter.hanlinExpo

      - name: Prepare Expo iOS dependency closure
        shell: bash
        run: |
          set -euxo pipefail
          node Scripts/Expo/prepare-ios-dependencies.mjs 2>&1 | tee "$LOG_DIR/02-expo-dependencies.log"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Prepare verified embedded RuntimeCore & host resources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          bash Scripts/Runtime/prepare-runtime-core.sh 2>&1 | tee "$LOG_DIR/03-prepare-runtime-core.log"
          bash Scripts/Runtime/prepare-runtime-host.sh 2>&1 | tee "$LOG_DIR/03-package-runtime-host.log"
          cp build/runtime-host/RuntimeHostResources.zip AI_HLY/RuntimeHostResources.zip

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Create CI Config.xcconfig
        shell: bash
        run: |
          set -euxo pipefail
          cat > Config.xcconfig <<'EOF'
          // Generated by GitHub Actions for CI builds.
          // Do not commit secrets here.

          HANLIN_API_KEY =
          HANLIN_OPEN_API_KEY =
          EOF

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Prepare NativeScript binary dependencies for package resolution
        shell: bash
        run: |
          set -euxo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix Scripts/NativeScript
          npm run prepare:ios-dependencies --prefix Scripts/NativeScript

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Prepare HanlinExpoNativeAPI iOS dependencies and artifacts
        shell: bash
        run: |
          set -euxo pipefail
          node Scripts/ExpoNativeAPI/prepare-ios-dependencies.mjs 2>&1 | tee "$LOG_DIR/03-prepare-nativeapi-dependencies.log"
          node Scripts/ExpoNativeAPI/verify-artifacts.mjs 2>&1 | tee "$LOG_DIR/03-verify-nativeapi-artifacts.log"
          node Scripts/ExpoNativeAPI/verify-nsmd.mjs 2>&1 | tee "$LOG_DIR/03-verify-nsmd.log"
          node Scripts/ExpoNativeAPI/preflight.mjs 2>&1 | tee "$LOG_DIR/03-nativeapi-preflight.log"
          node --test Scripts/ExpoNativeAPI/Tests/*.test.mjs 2>&1 | tee "$LOG_DIR/03-nativeapi-static-tests.log"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Verify HanlinExpoRuntime package resolution
        shell: bash
        run: |
          set -euxo pipefail
          swift package --package-path Packages/HanlinExpoNativeAPI resolve
          swift package --package-path Packages/HanlinExpoRuntime resolve

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Run focused HanlinScriptAnalyzerTests and HanlinScriptExtensionsTests
        id: package-regressions
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          swift test --package-path Packages/HanlinPlatform --filter HanlinScriptAnalyzerTests \
            2>&1 | tee "$LOG_DIR/04-analyzer-tests.log"
          swift test --package-path Packages/HanlinPlatform --filter HanlinScriptExtensionsTests \
            2>&1 | tee "$LOG_DIR/04-extensions-tests.log"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Resolve Swift Package dependencies
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt: resolving package dependencies..."
            if xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -resolvePackageDependencies \
              -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              2>&1 | tee "$LOG_DIR/04-resolve-packages.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve package dependencies after 3 attempts."
              exit 74
            fi
            echo "Retrying after cleaning SPM repository cache..."
            rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/* || true
            sleep 5
          done

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build Hanlin application for testing
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:AI_HLYUITests \
            -only-testing:AI_HLYTests/HanlinNativeWidgetRendererTests \
            ENABLE_TESTABILITY=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            | tee "$LOG_DIR/05-build-for-testing.log"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Preserve simulator extension and actual executable hashes
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -name AI_Hanlin.app -type d | head -1)"
          APPEX_PATH="$APP_PATH/PlugIns/HanlinScriptingWidgets.appex"
          test -d "$APPEX_PATH"
          mkdir -p "$LOG_DIR/widgets"
          for binary in "$APP_PATH/AI_Hanlin" "$APP_PATH/AI_Hanlin.debug.dylib" "$APPEX_PATH/HanlinScriptingWidgets" "$APPEX_PATH/HanlinScriptingWidgets.debug.dylib"; do
            if [ -f "$binary" ]; then shasum -a 256 "$binary"; fi
          done > "$LOG_DIR/widgets/executable-SHA256.txt"
          ditto -c -k --keepParent "$APPEX_PATH" "$LOG_DIR/widgets/HanlinScriptingWidgets-simulator.appex.zip"

      - name: Boot iPad Simulator and stage fixtures
        id: stage-fixtures
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -name 'AI_Hanlin.app' | head -1)"
          test -d "$APP_PATH"
          echo "Found app bundle at $APP_PATH"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "App bundle identifier: $BUNDLE_ID"

          selection="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS-27" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPad" in device.get("name", ""):
                      is_mini = 1 if "mini" in device.get("name", "") else 0
                      candidates.append((is_mini, runtime, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iOS 27 iPad simulator was found")
          candidates.sort(reverse=True)
          _, runtime, name, udid = candidates[0]
          print(f"{udid}\t{name}\t{runtime}")
          PY
          )"
          IFS=$'\t' read -r SIMULATOR_UDID SIMULATOR_MODEL SIMULATOR_RUNTIME <<< "$selection"
          test -n "$SIMULATOR_UDID"
          echo "Selected simulator: $SIMULATOR_MODEL ($SIMULATOR_UDID) running $SIMULATOR_RUNTIME"
          echo "$SIMULATOR_UDID" > "$LOG_DIR/simulator-udid.txt"

          python3 - "$SIMULATOR_UDID" "$LOG_DIR" <<'PY'
          import subprocess, sys
          from pathlib import Path
          simulator, log_dir = sys.argv[1:]
          log = Path(log_dir) / "06-bootstatus.log"
          with log.open("w") as output:
              try:
                  # An already booted simulator can make boot return nonzero;
                  # bootstatus remains the authoritative readiness check.
                  subprocess.run(["xcrun", "simctl", "boot", simulator], stdout=output, stderr=subprocess.STDOUT, timeout=60)
                  subprocess.run(["xcrun", "simctl", "bootstatus", simulator, "-b"], stdout=output, stderr=subprocess.STDOUT, timeout=900, check=True)
              except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as error:
                  output.write("\nSIMULATOR_BOOT_FAILED: " + str(error) + "\n")
                  output.flush()
                  for query in ("devices", "runtimes"):
                      try:
                          subprocess.run(["xcrun", "simctl", "list", query, "--json"], stdout=output, stderr=subprocess.STDOUT, timeout=20)
                      except subprocess.TimeoutExpired:
                          output.write("simctl diagnostics timed out\n")
                  raise SystemExit(74)
          print(log.read_text())
          PY

          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

          # Bounded fixture staging for app container and optional DocumentsApp (Files)
          python3 - "$SIMULATOR_UDID" "$BUNDLE_ID" <<'PY'
          import subprocess
          import sys
          import shutil
          import glob
          import os
          from pathlib import Path

          sim_udid = sys.argv[1]
          bundle_id = sys.argv[2]
          fixtures = glob.glob("AI_HLYUITests/Fixtures/*.hanlinExpo") + glob.glob("AI_HLYUITests/Fixtures/*.scripting")
          if not fixtures:
              print("Warning: No .hanlinExpo fixtures found in AI_HLYUITests/Fixtures")
              sys.exit(0)

          def find_container_dir(sim_id, target_bundle_id):
              # Try simctl first with 10s timeout
              try:
                  res = subprocess.run(
                      ["xcrun", "simctl", "get_app_container", sim_id, target_bundle_id, "data"],
                      capture_output=True,
                      text=True,
                      timeout=10,
                  )
                  if res.returncode == 0 and res.stdout.strip():
                      p = Path(res.stdout.strip())
                      if p.exists():
                          return p
              except Exception as e:
                  print(f"simctl lookup for {target_bundle_id} failed: {e}")

              # Fallback: scan CoreSimulator container metadata on disk directly
              base = Path.home() / "Library/Developer/CoreSimulator/Devices" / sim_id / "data/Containers/Data/Application"
              if base.exists():
                  for c in base.iterdir():
                      meta = c / ".com.apple.mobile_container_manager.metadata.plist"
                      if meta.exists():
                          try:
                              with open(meta, "rb") as mf:
                                  if target_bundle_id.encode() in mf.read():
                                      return c
                          except Exception:
                              pass
              return None

          # 1. App container
          app_container = find_container_dir(sim_udid, bundle_id)
          if app_container:
              docs = app_container / "Documents"
              docs.mkdir(parents=True, exist_ok=True)
              for f in fixtures:
                  shutil.copy2(f, docs / Path(f).name)
              print(f"Staged {len(fixtures)} fixtures into app Documents: {docs}")
          else:
              print(f"Warning: Could not locate app container for {bundle_id}")

          # 2. DocumentsApp (Files) container
          files_container = find_container_dir(sim_udid, "com.apple.DocumentsApp")
          if files_container:
              docs = files_container / "Documents"
              docs.mkdir(parents=True, exist_ok=True)
              for f in fixtures:
                  shutil.copy2(f, docs / Path(f).name)
              print(f"Staged {len(fixtures)} fixtures into Files Documents: {docs}")
          else:
              print("Files container not found (optional staging skipped)")
          PY

          echo "sim-udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Audit built native widget dependency closure
        id: widget-native-audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -name AI_Hanlin.app -type d | head -1)"
          audit_status=0
          node Scripts/Widgets/audit-native-products.mjs "$APP_PATH" "$LOG_DIR/widget-native-mach-o.json" || audit_status=$?
          find "$APP_PATH/PlugIns" \( -name HanlinScriptingWidgets -o -name HanlinScriptingWidgets.debug.dylib \) -type f -exec otool -L {} \; > "$LOG_DIR/widget-native-otool.log"
          find "$APP_PATH/PlugIns" \( -name HanlinScriptingWidgets -o -name HanlinScriptingWidgets.debug.dylib \) -type f -exec nm -g {} \; > "$LOG_DIR/widget-native-symbols.log"
          exit "$audit_status"

      - name: Run Expo SwiftUI Production E2E Tests
        shell: bash
        run: |
          set -euxo pipefail
          SIMULATOR_UDID="$(cat "$LOG_DIR/simulator-udid.txt")"
          # Sample process RSS without collecting process arguments or credentials.
          (
            for sample in $(seq 1 1200); do
              stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              ps -axo pid=,rss=,comm= | awk -v stamp="$stamp" '/HanlinScriptingWidgets|AI_Hanlin/ { print stamp, $0 }'
              sleep 2
            done
          ) > "$LOG_DIR/widget-simulator-rss-kib.log" &
          widget_probe_pid=$!
          trap 'kill "$widget_probe_pid" 2>/dev/null || true' EXIT
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            -only-testing:AI_HLYTests/HanlinNativeWidgetRendererTests \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testNativeLegacyWidgetWithHostTerminated \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testNativeExpoWidgetSourceActionsWithHostTerminated \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testNativeScriptWidgetBooleanWithHostTerminated \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testProductionExpoSwiftUIProbeEndToEnd \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testProductionExpoSearchableContentAndEvents \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testProductionExpoDynamicPackageSwitching \
            -only-testing:AI_HLYUITests/HanlinExpoProductionE2ETests/testProductionExpoLifecycleAndUninstall \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIMountAndInteraction \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIDynamicVariantSwitching \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIIncompatibleVersionRejection \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIMalformedPackageRejection \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIDeniedPersistedGrant \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIRevokeWhileMounted \
            -only-testing:AI_HLYUITests/HanlinExpoNativeAPIIntegrationUITests/testExpoNativeAPIRepeatedLifecycle \
            -resultBundlePath "build/ExpoE2EResults.xcresult" \
            2>&1 | tee "$LOG_DIR/07-expo-e2e-tests.log"

      - name: Diagnostic logs and crash reports
        if: always()
        shell: bash
        run: |
          set +e
          SIMULATOR_UDID="$(cat "$LOG_DIR/simulator-udid.txt" 2>/dev/null || true)"
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -name AI_Hanlin.app -type d | head -1)"
          if [ -n "$SIMULATOR_UDID" ] && [ -d "$APP_PATH" ]; then
            BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
            python3 Scripts/Widgets/capture-simulator-widget-state.py --device "$SIMULATOR_UDID" --bundle-id "$BUNDLE_ID" \
              --group group.com.itorah.chavrusachat --output "$LOG_DIR/widgets/widget-state-trace.json"
          fi
          echo "=== DIAGNOSTIC REPORTS / CRASH REPORTS ==="
          find ~/Library/Logs/DiagnosticReports -type f | while read -r f; do
            echo "--- $f ---"
            cat "$f"
          done
          if [ -n "$SIMULATOR_UDID" ]; then
            echo "=== SIMULATOR APP LOGS (LAST 100 LINES) ==="
            python3 -c "import subprocess, sys; subprocess.run(['xcrun', 'simctl', 'spawn', sys.argv[1], 'log', 'show', '--style', 'compact', '--last', '5m', '--predicate', 'process == \"AI_Hanlin\"'], stdout=open(sys.argv[2], 'w'), stderr=subprocess.STDOUT, timeout=30)" "$SIMULATOR_UDID" "$LOG_DIR/08-ai-hanlin-simulator.log" 2>/dev/null || true
            tail -n 100 "$LOG_DIR/08-ai-hanlin-simulator.log" || true
          fi

      - name: Live Activity · refresh
        if: always()
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Preserve package and native closure failures as required gates
        if: always() && (steps.package-regressions.outcome == 'failure' || steps.widget-native-audit.outcome == 'failure')
        shell: bash
        run: exit 1

      - name: Upload Test Results and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-runtime-spike-results
          path: |
            build-logs/
            build/*.xcresult
