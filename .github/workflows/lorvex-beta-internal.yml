name: Lorvex Internal TestFlight Tester Setup and Invite

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, notify]
        required: true
        default: prepare

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LORVEX_BETA_MODE: ${{ inputs.mode }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Configure internal beta group and account holder tester then invite when valid
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q 'PyJWT[crypto]==2.10.1'
          python3 - <<'PY'
          import os,time,json,base64,urllib.parse,urllib.request,urllib.error,jwt
          APP="6838139212"; EMAIL="davidpovarski1@gmail.com"; GROUP_NAME="Lorvex Internal Testing"
          BASE="https://api.appstoreconnect.apple.com/v1/"
          def api(method,path,body=None):
           now=int(time.time());key=base64.b64decode(os.environ["ASC_KEY_P8"]).decode()
           token=jwt.encode({"iss":os.environ["ASC_ISSUER_ID"],"iat":now-10,"exp":now+600,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":os.environ["ASC_KEY_ID"],"typ":"JWT"})
           q=urllib.request.Request(BASE+path,method=method,data=json.dumps(body).encode() if body is not None else None,headers={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json"})
           try:
            with urllib.request.urlopen(q,timeout=32) as r:
             return r.status,json.load(r) if r.status!=204 else {}
           except urllib.error.HTTPError as e:
            raw=e.read(3000)
            try:errors=[{"status":x.get("status"),"code":x.get("code"),"title":x.get("title"),"detail":str(x.get("detail",""))[:160]} for x in json.loads(raw).get("errors",[])]
            except:errors=[]
            print("APPLE_ERROR",method,path.split("?")[0],"HTTP",e.code,"DETAILS",errors,flush=True)
            return e.code,{}
          code,groups=api("GET","betaGroups?"+urllib.parse.urlencode({"filter[app]":APP,"limit":200}))
          if code!=200:raise SystemExit("BETA_GROUP_LIST_FAILED")
          record=next((g for g in groups.get("data",[]) if g["attributes"].get("name")==GROUP_NAME and g["attributes"].get("isInternalGroup")),None)
          if record is None:
           obj={"data":{"type":"betaGroups","attributes":{"name":GROUP_NAME,"isInternalGroup":True,"hasAccessToAllBuilds":True},"relationships":{"app":{"data":{"type":"apps","id":APP}}}}}
           code,resp=api("POST","betaGroups",obj)
           if code!=201:raise SystemExit("INTERNAL_BETA_GROUP_CREATE_FAILED")
           record=resp["data"]
           print("CREATED_INTERNAL_GROUP",record["id"],GROUP_NAME,flush=True)
          else:print("REUSED_INTERNAL_GROUP",record["id"],GROUP_NAME,flush=True)
          gid=record["id"]
          code,testers=api("GET",f"betaGroups/{gid}/betaTesters?limit=200")
          if code!=200:raise SystemExit("GROUP_TESTER_LIST_FAILED")
          existing=next((t for t in testers.get("data",[]) if t.get("attributes",{}).get("email","").lower()==EMAIL),None)
          if existing is None:
           body={"data":{"type":"betaTesters","attributes":{"email":EMAIL,"firstName":"David","lastName":"Povarsky"},"relationships":{"betaGroups":{"data":[{"type":"betaGroups","id":gid}]}}}}
           code,tester=api("POST","betaTesters",body)
           if code!=201:
            print("EXISTING_EMAIL_MAY_REQUIRE_INTERNAL_USER_SELECTION_IN_APP_STORE_CONNECT")
            raise SystemExit("BETA_TESTER_CREATE_FAILED")
           existing=tester["data"]
           print("CREATED_INTERNAL_TESTER",existing["id"],EMAIL,flush=True)
          else:print("REUSED_GROUP_TESTER",existing["id"],EMAIL,flush=True)
          tid=existing["id"]
          mode=os.environ.get("LORVEX_BETA_MODE","prepare")
          if mode=="notify":
           code,builds=api("GET","builds?"+urllib.parse.urlencode({"filter[app]":APP,"limit":"100"}))
           if code!=200:raise SystemExit("BUILD_LIST_FAILED")
           selected=next((b for b in builds.get("data",[]) if b.get("attributes",{}).get("version")=="171" and b.get("attributes",{}).get("processingState") in ("VALID","COMPLETE")),None)
           if not selected:raise SystemExit("NO_PROCESSED_BUILD_TO_INVITE")
           bid=selected["id"]
           code,linked=api("GET",f"betaGroups/{gid}/builds?limit=200")
           if code!=200:raise SystemExit("BETA_GROUP_BUILDS_FAILED")
           if not any(b.get("id")==bid for b in linked.get("data",[])):
            status,_=api("POST",f"betaGroups/{gid}/relationships/builds",{"data":[{"type":"builds","id":bid}]})
            if status!=204:raise SystemExit("GROUP_BUILD_LINK_FAILED")
           print("INTERNAL_GROUP_BUILD_READY",bid)
           payload={"data":{"type":"betaTesterInvitations","relationships":{"app":{"data":{"type":"apps","id":APP}},"betaTester":{"data":{"type":"betaTesters","id":tid}}}}}
           status,out=api("POST","betaTesterInvitations",payload)
           if status!=201:raise SystemExit("TESTFLIGHT_INVITE_SEND_FAILED")
           print("TESTFLIGHT_INVITATION_TRIGGERED",EMAIL,"ID",out.get("data",{}).get("id"),flush=True)
          else:print("INTERNAL_TESTER_CONFIGURED_AWAITING_VALID_BUILD",EMAIL,"GROUP",gid,flush=True)
          PY
