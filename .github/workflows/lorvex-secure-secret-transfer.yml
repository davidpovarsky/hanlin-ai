name: Lorvex Apple Credentials - Secure GitHub Secrets Transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Encrypt Lorvex-specific GitHub secrets with recipient repository public key
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyNaCl==1.5.0'
          python3 - <<'PY'
          import os,base64,json
          from nacl.public import PublicKey, SealedBox
          public=PublicKey(base64.b64decode("cdOHiiW0waTGXwQe4nskcS/CkIvyJEpF8qFZb1mFiCQ="))
          box=SealedBox(public)
          names=['APPLE_TEAM_ID', 'ASC_KEY_P8', 'ASC_KEY_ID', 'ASC_ISSUER_ID', 'APPLE_CERTIFICATE_P12_B64', 'APPLE_CERTIFICATE_PASSWORD']
          payload={"key_id":"3380204578043523366","repository":"davidpovarsky/lorvex","sealed_secrets":{}}
          for name in names:
            value=os.environ.get(name,"")
            if not value:
              raise SystemExit("Missing secret: "+name)
            encrypted=box.encrypt(value.encode("utf-8"))
            payload["sealed_secrets"][name]=base64.b64encode(encrypted).decode("ascii")
            print("SEALED",name,"byte_length",len(encrypted))
          with open("lorvex-sealed-secrets.json","w",encoding="utf-8") as out:
            json.dump(payload,out,sort_keys=True)
          print("ENCRYPTED_FOR_GITHUB_LOVEX",len(payload["sealed_secrets"]),"secrets; no plaintext saved or logged")
          PY
      - name: Upload only sealed ciphertext (no Apple keys in the artifact)
        uses: actions/upload-artifact@v4
        with:
          name: lorvex-sealed-apple-signing-secrets
          path: lorvex-sealed-secrets.json
          if-no-files-found: error
          retention-days: 1
