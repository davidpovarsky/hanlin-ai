name: Build iOS 26 Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Choose full verification (including IPA) or only the iPad Simulator production-path checks
        required: true
        default: full
        type: choice
        options:
          - full
          - simulator-only
      runtime_bundle_only:
        description: Validate and publish the pinned RuntimeCore bundle without building the app
        required: true
        default: false
        type: boolean
      phase1_validation_only:
        description: Validate the Phase 0 baseline and Phase 1 contracts without building the app
        required: true
        default: false
        type: boolean
      fast_validation_only:
        description: Run incremental Debug simulator tests and a basic launch without Release IPA or runtime acceptance
        required: true
        default: false
        type: boolean
      script_restart_repro_only:
        description: Run only the exact physical-iPad Script App process-boundary regression and evidence capture
        required: true
        default: false
        type: boolean
      force_clean_build:
        description: Discard compiler build state and perform a clean diagnostic rebuild
        required: true
        default: false
        type: boolean
      measure_warm_rebuild:
        description: Run one same-run no-op rebuild to measure Xcode incremental reuse
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-hanlin-platform-phase1:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.runtime_bundle_only && inputs.validation_mode != 'simulator-only' }}
    name: Validate baseline, contracts, tests, and iOS compilation
    runs-on: macos-26
    timeout-minutes: 60

    env:
      BASELINE_ID: scripting-compat-2026-08-26-a91e6672cb47
      BASELINE_SHA256: a91e6672cb470fcd5c3185a29ed25832a187008de55e7acd40e4008331efc125
      BASELINE_FILES: "1005"
      BASELINE_BYTES: "6019985"
      EXPECTED_FIXTURES: "177"
      PACKAGE_PATH: Packages/HanlinPlatform
      LOG_DIR: phase1-validation-logs

    steps:
      - name: Select newest stable Xcode 26 and print environment
        id: phase1-toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/$LOG_DIR"
          {
            selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print \
              | grep -E '/Xcode_26([._][0-9]+)*\.app$' \
              | sort -V \
              | tail -1)"
            test -n "$selected_xcode"
            sudo xcode-select -s "$selected_xcode/Contents/Developer"
            sw_vers
            xcodebuild -version
            xcode-select -p
            swift --version
            xcodebuild -showsdks
            xcodebuild -showsdks | grep -E 'iphoneos26|iOS 26'
            xcodebuild -showsdks | grep -E 'iphonesimulator26|iOS Simulator 26'
          } 2>&1 | tee "$RUNNER_TEMP/$LOG_DIR/00-environment.log"
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          xcode_build="$(xcodebuild -version | sed -n '2s/^Build version //p')"
          runner_arch="$(uname -m)"
          iphoneos_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "xcode-version=$xcode_version" >> "$GITHUB_OUTPUT"
          echo "xcode-build=$xcode_build" >> "$GITHUB_OUTPUT"
          echo "runner-arch=$runner_arch" >> "$GITHUB_OUTPUT"
          echo "iphoneos-sdk=$iphoneos_sdk" >> "$GITHUB_OUTPUT"
          echo "simulator-sdk=$simulator_sdk" >> "$GITHUB_OUTPUT"

      - name: Check out exact validation commit cleanly
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Confirm clean exact checkout
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - name: Set up pinned baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0

      - name: Prepare validation logs
        run: |
          set -euxo pipefail
          absolute_log_dir="$RUNNER_TEMP/$LOG_DIR"
          mkdir -p "$absolute_log_dir" build
          echo "LOG_DIR=$absolute_log_dir" >> "$GITHUB_ENV"

      - name: Test Xcode cache input normalization
        run: |
          set -euxo pipefail
          python3 -m unittest discover \
            -s Scripts/CI/Tests \
            -p 'test_*.py' \
            -v 2>&1 | tee "$LOG_DIR/00-xcode-cache-input-tests.log"

      - name: Restore Phase 1 SwiftPM build cache
        if: ${{ !inputs.force_clean_build }}
        id: phase1-spm-cache
        uses: actions/cache/restore@v6
        with:
          path: Packages/HanlinPlatform/.build
          key: phase1-spm-v1-${{ runner.os }}-${{ steps.phase1-toolchain.outputs.runner-arch }}-${{ steps.phase1-toolchain.outputs.xcode-build }}-${{ hashFiles('Packages/HanlinPlatform/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            phase1-spm-v1-${{ runner.os }}-${{ steps.phase1-toolchain.outputs.runner-arch }}-${{ steps.phase1-toolchain.outputs.xcode-build }}-${{ hashFiles('Packages/HanlinPlatform/Package.swift') }}-

      - name: Restore Phase 1 simulator compiler cache
        if: ${{ !inputs.force_clean_build }}
        id: phase1-simulator-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/Phase1SimulatorDerivedData/Build
            build/Phase1SimulatorDerivedData/ModuleCache.noindex
            build/Phase1SimulatorDerivedData/SDKStatCaches.noindex
          key: phase1-derived-v1-${{ runner.os }}-${{ steps.phase1-toolchain.outputs.runner-arch }}-${{ steps.phase1-toolchain.outputs.xcode-build }}-iphonesimulator-${{ steps.phase1-toolchain.outputs.simulator-sdk }}-debug-${{ hashFiles('Packages/HanlinPlatform/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            phase1-derived-v1-${{ runner.os }}-${{ steps.phase1-toolchain.outputs.runner-arch }}-${{ steps.phase1-toolchain.outputs.xcode-build }}-iphonesimulator-${{ steps.phase1-toolchain.outputs.simulator-sdk }}-debug-${{ hashFiles('Packages/HanlinPlatform/Package.swift') }}-

      - name: Restore Phase 1 device compiler cache
        if: ${{ !inputs.force_clean_build }}
        id: phase1-device-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/Phase1DeviceDerivedData/Build
            build/Phase1DeviceDerivedData/ModuleCache.noindex
            build/Phase1DeviceDerivedData/SDKStatCaches.noindex
          key: phase1-derived-v1-${{ runner.os }}-${{ steps.phase1-toolchain.outputs.runner-arch }}-${{ steps.phase1-toolchain.outputs.xcode-build }}-iphoneos-${{ steps.phase1-toolchain.outputs.iphoneos-sdk }}-debug-${{ hashFiles('Packages/HanlinPlatform/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            phase1-derived-v1-${{ runner.os }}-${{ steps.phase1-toolchain.outputs.runner-arch }}-${{ steps.phase1-toolchain.outputs.xcode-build }}-iphoneos-${{ steps.phase1-toolchain.outputs.iphoneos-sdk }}-debug-${{ hashFiles('Packages/HanlinPlatform/Package.swift') }}-

      - name: Report Phase 1 cache mode
        run: |
          set -euo pipefail
          cache_state() {
            if [ "$1" = "true" ]; then echo exact-hit
            elif [ -n "$2" ]; then echo fallback-hit
            else echo miss
            fi
          }
          {
            echo "force_clean_build=${{ inputs.force_clean_build }}"
            echo "SwiftPM=$(cache_state '${{ steps.phase1-spm-cache.outputs.cache-hit }}' '${{ steps.phase1-spm-cache.outputs.cache-matched-key }}')"
            echo "SimulatorDerivedData=$(cache_state '${{ steps.phase1-simulator-cache.outputs.cache-hit }}' '${{ steps.phase1-simulator-cache.outputs.cache-matched-key }}')"
            echo "DeviceDerivedData=$(cache_state '${{ steps.phase1-device-cache.outputs.cache-hit }}' '${{ steps.phase1-device-cache.outputs.cache-matched-key }}')"
          } | tee "$LOG_DIR/00-cache-mode.log"

      - name: Discard Phase 1 compiler state for forced clean build
        if: ${{ inputs.force_clean_build }}
        run: |
          set -euxo pipefail
          echo "FORCED CLEAN BUILD: discarding Phase 1 SwiftPM and DerivedData compiler state."
          rm -rf \
            Packages/HanlinPlatform/.build \
            build/Phase1SimulatorDerivedData \
            build/Phase1DeviceDerivedData

      - name: Verify Scripting baseline integrity and reproducibility
        run: |
          set -euxo pipefail
          {
            node Scripts/ScriptingReference/verify-scripting-reference.mjs
            node Scripts/ScriptingReference/build-scripting-inventory.mjs --check
            node Scripts/ScriptingReference/validate-scripting-examples.mjs
            node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const baseline = JSON.parse(
            await readFile("Reference/ScriptingCompatibility/BASELINE.json", "utf8"),
          );
          const sums = JSON.parse(
            await readFile(
              "Reference/ScriptingCompatibility/SHA256SUMS.json",
              "utf8",
            ),
          );
          const examples = JSON.parse(
            await readFile(
              "Reference/ScriptingCompatibility/Generated/example-index.json",
              "utf8",
            ),
          );
          const expected = {
            id: process.env.BASELINE_ID,
            sha256: process.env.BASELINE_SHA256,
            files: Number(process.env.BASELINE_FILES),
            bytes: Number(process.env.BASELINE_BYTES),
            fixtures: Number(process.env.EXPECTED_FIXTURES),
          };
          const actual = {
            id: baseline.baselineID,
            sha256: baseline.aggregateSHA256,
            files: sums.files.length,
            bytes: sums.files.reduce((total, file) => total + file.bytes, 0),
            fixtures: examples.examples.length,
          };
          for (const key of Object.keys(expected)) {
            if (actual[key] !== expected[key]) {
              throw new Error(
                `${key}: expected ${expected[key]}, received ${actual[key]}`,
              );
            }
          }
          console.log(JSON.stringify(actual, null, 2));
          NODE
            node Scripts/ScriptingReference/build-scripting-inventory.mjs
            git diff --exit-code -- Reference/ScriptingCompatibility
          } 2>&1 | tee "$LOG_DIR/01-scripting-baseline.log"

      - name: Validate JSON and internal JSON Schema references
        run: |
          set -euxo pipefail
          node Scripts/ScriptingReference/validate-json-and-schema.mjs \
            2>&1 | tee "$LOG_DIR/02-json-schema.log"

      - name: Verify exact TypeScript 7.0.2 Scripting artifacts
        run: |
          set -euxo pipefail
          npm ci --ignore-scripts --prefix Scripts/ScriptingCompiler
          npm test --prefix Scripts/ScriptingCompiler \
            2>&1 | tee "$LOG_DIR/02-scripting-compiler.log"

      - name: Scripting Production Compiler Acceptance
        run: |
          set -euxo pipefail
          npm ci --ignore-scripts --no-audit --no-fund \
            --prefix AI_HLY/Downstream/RuntimeCore/Node/Host
          npm run test:production --prefix Scripts/ScriptingCompiler \
            2>&1 | tee "$LOG_DIR/02-production-compiler-acceptance.log"

      - name: Resolve the Phase 1 Swift package
        run: |
          set -euxo pipefail
          swift package --package-path "$PACKAGE_PATH" resolve \
            2>&1 | tee "$LOG_DIR/03-swift-package-resolve.log"

      - name: Compile the Phase 1 Swift package
        run: |
          set -euxo pipefail
          swift build --package-path "$PACKAGE_PATH" \
            2>&1 | tee "$LOG_DIR/04-swift-build.log"

      - name: Compile and execute all Phase 1 contract tests
        run: |
          set -euxo pipefail
          swift test --package-path "$PACKAGE_PATH" --parallel \
            2>&1 | tee "$LOG_DIR/05-swift-test.log"

      - name: Save successful Phase 1 SwiftPM build cache
        if: ${{ success() && !inputs.force_clean_build }}
        uses: actions/cache/save@v6
        with:
          path: Packages/HanlinPlatform/.build
          key: ${{ steps.phase1-spm-cache.outputs.cache-primary-key }}

      - name: Discover the generated Xcode package scheme
        working-directory: Packages/HanlinPlatform
        run: |
          set -euxo pipefail
          xcodebuild -list -json \
            > "$LOG_DIR/06-xcodebuild-list.json" \
            2> >(tee "$LOG_DIR/06-xcodebuild-list.stderr.log" >&2)
          cat "$LOG_DIR/06-xcodebuild-list.json"
          package_scheme="$(python3 - "$LOG_DIR/06-xcodebuild-list.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              document = json.load(stream)
          container = document.get("workspace") or document.get("project") or {}
          schemes = container.get("schemes") or []
          if "HanlinPlatform-Package" in schemes:
              print("HanlinPlatform-Package")
          elif len(schemes) == 1:
              print(schemes[0])
          else:
              raise SystemExit(f"Expected one generated package scheme, found: {schemes}")
          PY
          )"
          test -n "$package_scheme"
          echo "PACKAGE_XCODE_SCHEME=$package_scheme" >> "$GITHUB_ENV"
          echo "Selected generated package scheme: $package_scheme"

      - name: Compile contracts for generic iOS Simulator
        working-directory: Packages/HanlinPlatform
        run: |
          set -euxo pipefail
          rm -rf "$LOG_DIR/Phase1Simulator.xcresult"
          build_actions=(build)
          if [ "${{ inputs.force_clean_build }}" = "true" ]; then
            build_actions=(clean build)
          fi
          started_at="$(date +%s)"
          xcodebuild \
            -scheme "$PACKAGE_XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/Phase1SimulatorDerivedData" \
            -resultBundlePath "$LOG_DIR/Phase1Simulator.xcresult" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            "${build_actions[@]}" 2>&1 | tee "$LOG_DIR/07-ios-simulator.log"
          echo "$(( $(date +%s) - started_at ))" > "$LOG_DIR/07-ios-simulator-duration-seconds.txt"

      - name: Save successful Phase 1 simulator compiler cache
        if: ${{ success() && !inputs.force_clean_build }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/Phase1SimulatorDerivedData/Build
            build/Phase1SimulatorDerivedData/ModuleCache.noindex
            build/Phase1SimulatorDerivedData/SDKStatCaches.noindex
          key: ${{ steps.phase1-simulator-cache.outputs.cache-primary-key }}

      - name: Compile contracts for generic iOS device
        working-directory: Packages/HanlinPlatform
        run: |
          set -euxo pipefail
          rm -rf "$LOG_DIR/Phase1Device.xcresult"
          build_actions=(build)
          if [ "${{ inputs.force_clean_build }}" = "true" ]; then
            build_actions=(clean build)
          fi
          started_at="$(date +%s)"
          xcodebuild \
            -scheme "$PACKAGE_XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/Phase1DeviceDerivedData" \
            -resultBundlePath "$LOG_DIR/Phase1Device.xcresult" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            "${build_actions[@]}" 2>&1 | tee "$LOG_DIR/08-ios-device.log"
          echo "$(( $(date +%s) - started_at ))" > "$LOG_DIR/08-ios-device-duration-seconds.txt"

      - name: Save successful Phase 1 device compiler cache
        if: ${{ success() && !inputs.force_clean_build }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/Phase1DeviceDerivedData/Build
            build/Phase1DeviceDerivedData/ModuleCache.noindex
            build/Phase1DeviceDerivedData/SDKStatCaches.noindex
          key: ${{ steps.phase1-device-cache.outputs.cache-primary-key }}

      - name: Summarize compiler warnings
        if: always()
        run: |
          set -uo pipefail
          {
            echo "Compiler warnings retained for review:"
            grep -RIn --include='*.log' 'warning:' "$LOG_DIR" || true
          } | tee "$LOG_DIR/09-warnings.log"

      - name: Retain Phase 1 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-validation-${{ github.sha }}
          path: ${{ runner.temp }}/phase1-validation-logs
          if-no-files-found: error
          retention-days: 30

  validate-runtime-bundle:
    if: ${{ inputs.runtime_bundle_only && !inputs.phase1_validation_only }}
    name: Run split RuntimeCore bundle pipeline
    uses: ./.github/workflows/build-runtime-bundle.yml
    with:
      publish_release: true
      force_rebuild: false
    permissions:
      actions: read
      contents: write

  build-ios26-unsigned-ipa:
    if: ${{ github.event_name == 'push' || (!inputs.runtime_bundle_only && !inputs.phase1_validation_only && !inputs.fast_validation_only && inputs.validation_mode == 'full') }}
    name: Build unsigned IPA with Xcode 26
    runs-on: macos-26
    timeout-minutes: 60

    env:
      PROJECT_PATH: AI_HLY.xcodeproj
      SCHEME_NAME: AI_HLY
      APP_NAME: AI_Hanlin
      CONFIGURATION: Release
      DERIVED_DATA_PATH: build/DerivedData
      CLONED_PACKAGES_PATH: build/SourcePackages
      LOG_DIR: build-logs
      IPA_NAME: AI_Hanlin-iOS26-unsigned.ipa
      IOS_DEPLOYMENT_TARGET: "26.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned RuntimeCore host Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0
          cache: npm
          cache-dependency-path: AI_HLY/Downstream/RuntimeCore/Node/Host/package-lock.json

      - name: Prepare log folders
        run: |
          set -euxo pipefail
          mkdir -p "$LOG_DIR"
          mkdir -p build
          echo "Log folder prepared at: $LOG_DIR" | tee "$LOG_DIR/00-prepare.log"

      - name: Show runner and Xcode environment
        run: |
          set -euxo pipefail

          {
            echo "===== Date ====="
            date

            echo
            echo "===== macOS ====="
            sw_vers

            echo
            echo "===== Kernel ====="
            uname -a

            echo
            echo "===== Current Xcode ====="
            xcode-select -p || true
            xcodebuild -version || true

            echo
            echo "===== Installed Xcodes ====="
            ls -la /Applications | grep -E "Xcode" || true

            echo
            echo "===== Available SDKs ====="
            xcodebuild -showsdks || true

            echo
            echo "===== Repository root ====="
            pwd
            ls -la

            echo
            echo "===== Top-level files ====="
            find . -maxdepth 3 -type f | sort | sed -n '1,400{s#^\./##;p;}'
          } 2>&1 | tee "$LOG_DIR/01-environment.log"

      - name: Select Xcode 26
        id: app-toolchain
        run: |
          set -euxo pipefail

          {
            echo "Trying to select the newest available Xcode 26..."

            if [ -d "/Applications/Xcode_26.6.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
              echo "Selected Xcode 26.6"
            elif [ -d "/Applications/Xcode_26.5.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
              echo "Selected Xcode 26.5"
            elif [ -d "/Applications/Xcode_26.4.1.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
              echo "Selected Xcode 26.4.1"
            elif [ -d "/Applications/Xcode_26.4.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
              echo "Selected Xcode 26.4"
            elif [ -d "/Applications/Xcode_26.3.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
              echo "Selected Xcode 26.3"
            elif [ -d "/Applications/Xcode_26.2.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
              echo "Selected Xcode 26.2"
            elif [ -d "/Applications/Xcode_26.1.1.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
              echo "Selected Xcode 26.1.1"
            elif [ -d "/Applications/Xcode_26.0.1.app" ]; then
              sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
              echo "Selected Xcode 26.0.1"
            else
              echo "ERROR: No Xcode 26 installation found on this runner."
              echo "Available Xcodes:"
              ls -la /Applications | grep -E "Xcode" || true
              exit 1
            fi

            echo
            echo "===== Selected developer dir ====="
            xcode-select -p

            echo
            echo "===== Selected Xcode version ====="
            xcodebuild -version

            echo
            echo "===== SDKs after selection ====="
            xcodebuild -showsdks

            echo
            echo "===== iOS SDK check ====="
            xcodebuild -showsdks | grep -E "iphoneos26|iOS 26" || {
              echo "ERROR: Xcode 26 selected, but iOS 26 SDK was not found."
              exit 1
            }
          } 2>&1 | tee "$LOG_DIR/02-select-xcode26.log"
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          xcode_build="$(xcodebuild -version | sed -n '2s/^Build version //p')"
          runner_arch="$(uname -m)"
          iphoneos_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "xcode-version=$xcode_version" >> "$GITHUB_OUTPUT"
          echo "xcode-build=$xcode_build" >> "$GITHUB_OUTPUT"
          echo "runner-arch=$runner_arch" >> "$GITHUB_OUTPUT"
          echo "iphoneos-sdk=$iphoneos_sdk" >> "$GITHUB_OUTPUT"

      - name: Restore cloned Swift package dependencies
        id: app-sourcepackages-cache
        uses: actions/cache/restore@v6
        with:
          path: build/SourcePackages
          key: ios-sourcepackages-v1-${{ runner.os }}-${{ steps.app-toolchain.outputs.runner-arch }}-${{ steps.app-toolchain.outputs.xcode-build }}-${{ hashFiles('AI_HLY.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/HanlinPlatform/Package.swift', 'Packages/HanlinQuickJS/Package.swift', 'Packages/IOSSystemLite/Package.swift') }}
          restore-keys: |
            ios-sourcepackages-v1-${{ runner.os }}-${{ steps.app-toolchain.outputs.runner-arch }}-${{ steps.app-toolchain.outputs.xcode-build }}-

      - name: Restore compatible incremental Xcode compiler state
        if: ${{ !inputs.force_clean_build }}
        id: app-deriveddata-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/DerivedData/Build
            build/DerivedData/ModuleCache.noindex
            build/DerivedData/SDKStatCaches.noindex
            build/DerivedData/CacheMetadata/xcode-build-inputs.json
          key: ios-derived-v2-${{ runner.os }}-${{ steps.app-toolchain.outputs.runner-arch }}-${{ steps.app-toolchain.outputs.xcode-build }}-iphoneos-${{ steps.app-toolchain.outputs.iphoneos-sdk }}-${{ env.CONFIGURATION }}-${{ hashFiles('AI_HLY.xcodeproj/project.pbxproj', 'AI_HLY.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/HanlinPlatform/Package.swift', 'Packages/HanlinQuickJS/Package.swift', 'Packages/IOSSystemLite/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-v2-${{ runner.os }}-${{ steps.app-toolchain.outputs.runner-arch }}-${{ steps.app-toolchain.outputs.xcode-build }}-iphoneos-${{ steps.app-toolchain.outputs.iphoneos-sdk }}-${{ env.CONFIGURATION }}-${{ hashFiles('AI_HLY.xcodeproj/project.pbxproj', 'AI_HLY.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/HanlinPlatform/Package.swift', 'Packages/HanlinQuickJS/Package.swift', 'Packages/IOSSystemLite/Package.swift') }}-

      - name: Report application build cache mode
        run: |
          set -euo pipefail
          cache_state() {
            if [ "$1" = "true" ]; then echo exact-hit
            elif [ -n "$2" ]; then echo fallback-hit
            else echo miss
            fi
          }
          sourcepackages_state="$(cache_state '${{ steps.app-sourcepackages-cache.outputs.cache-hit }}' '${{ steps.app-sourcepackages-cache.outputs.cache-matched-key }}')"
          deriveddata_state="$(cache_state '${{ steps.app-deriveddata-cache.outputs.cache-hit }}' '${{ steps.app-deriveddata-cache.outputs.cache-matched-key }}')"
          if [ "${{ inputs.force_clean_build }}" = "true" ]; then
            build_mode=forced-clean
            deriveddata_state=disabled-for-forced-clean
          elif [ -n "${{ steps.app-deriveddata-cache.outputs.cache-matched-key }}" ]; then
            build_mode=restored-incremental
          else
            build_mode=cold
          fi
          {
            echo "force_clean_build=${{ inputs.force_clean_build }}"
            echo "SourcePackages=$sourcepackages_state"
            echo "DerivedData=$deriveddata_state"
            echo "build_mode=$build_mode"
            echo "selected_xcode=${{ steps.app-toolchain.outputs.xcode-version }}"
            echo "selected_xcode_build=${{ steps.app-toolchain.outputs.xcode-build }}"
            echo "runner_arch=${{ steps.app-toolchain.outputs.runner-arch }}"
            echo "iphoneos_sdk=${{ steps.app-toolchain.outputs.iphoneos-sdk }}"
          } | tee "$LOG_DIR/02-cache-mode.log"

      - name: Discard application compiler state for forced clean build
        if: ${{ inputs.force_clean_build }}
        run: |
          set -euxo pipefail
          echo "FORCED CLEAN BUILD: dependency downloads may be reused; DerivedData will not be restored or saved."
          rm -rf "$DERIVED_DATA_PATH"

      - name: Create CI Config.xcconfig
        run: |
          set -euxo pipefail

          {
            echo "Creating minimal Config.xcconfig for CI."
            echo "The repository ignores Config.xcconfig, so CI must generate it."

            cat > Config.xcconfig <<'EOF'
          // Generated by GitHub Actions for CI builds.
          // Do not commit secrets here.

          HANLIN_API_KEY =
          HANLIN_OPEN_API_KEY =
          EOF

            echo
            echo "===== Config.xcconfig ====="
            cat Config.xcconfig
          } 2>&1 | tee "$LOG_DIR/03-create-config-xcconfig.log"

      - name: Prepare verified embedded RuntimeCore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          bash Scripts/Runtime/prepare-runtime-core.sh 2>&1 | tee "$LOG_DIR/04-prepare-runtime-core.log"
          grep -Fq "Prepared verified RuntimeCore 7d967563db0809a4efa0f07b75d6b5928379a3b6f3aafb886899a79f59512a93" "$LOG_DIR/04-prepare-runtime-core.log"

      - name: Verify MCP host on pinned Node 24.5.0
        run: |
          set -euxo pipefail
          test "$(node --version)" = "v24.5.0"
          verification_root="$(mktemp -d "$RUNNER_TEMP/mcp-host-verification.XXXXXX")"
          trap 'rm -rf "$verification_root"' EXIT
          cp -R AI_HLY/Downstream/RuntimeCore/Node/Host/. "$verification_root/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$verification_root" \
            2>&1 | tee "$LOG_DIR/04-mcp-host-npm-ci.log"
          npm test --prefix "$verification_root" \
            2>&1 | tee "$LOG_DIR/04-mcp-host-tests.log"
          npm run test:integration --prefix "$verification_root" \
            2>&1 | tee "$LOG_DIR/04-mcp-server-everything-integration.log"
          node Scripts/Runtime/validate-mcp-install-dedup.mjs \
            2>&1 | tee "$LOG_DIR/04-mcp-install-dedup.log"

      - name: Scripting Production Compiler Acceptance
        run: |
          set -euxo pipefail
          npm ci --ignore-scripts --no-audit --no-fund \
            --prefix Scripts/ScriptingCompiler
          npm ci --ignore-scripts --no-audit --no-fund \
            --prefix AI_HLY/Downstream/RuntimeCore/Node/Host
          npm run test:production --prefix Scripts/ScriptingCompiler \
            2>&1 | tee "$LOG_DIR/04-production-compiler-acceptance.log"
          rm -rf AI_HLY/Downstream/RuntimeCore/Node/Host/node_modules
          test ! -e AI_HLY/Downstream/RuntimeCore/Node/Host/node_modules

      - name: Package current RuntimeCore host resources
        run: |
          set -euxo pipefail
          bash Scripts/Runtime/prepare-runtime-host.sh 2>&1 | tee "$LOG_DIR/04-package-runtime-host.log"
          cp build/runtime-host/RuntimeHostResources.zip AI_HLY/RuntimeHostResources.zip
          unzip -Z1 AI_HLY/RuntimeHostResources.zip | grep -Fx 'runtime-probe.mjs'
          unzip -p AI_HLY/RuntimeHostResources.zip server-worker.mjs | grep -F 'registerHooks'
          unzip -p AI_HLY/RuntimeHostResources.zip package-compatibility.mjs | grep -F 'inspectArchiveSafety'

      - name: Run RuntimeCore fast preflight
        run: |
          set -euxo pipefail
          bash Scripts/Runtime/preflight-runtime-core.sh 2>&1 | tee "$LOG_DIR/04-runtime-preflight.log"

      - name: Confirm native RuntimeCore reuse
        run: |
          set -euxo pipefail
          test "$(node Scripts/Runtime/compute-runtime-dependency-hash.mjs RuntimeDependencies.lock.json)" = \
            "7d967563db0809a4efa0f07b75d6b5928379a3b6f3aafb886899a79f59512a93"
          git diff --exit-code -- RuntimeDependencies.lock.json
          if grep -E '(configure|cmake|ninja|make).*(Node|nodejs|V8|Python)' \
            "$LOG_DIR/04-prepare-runtime-core.log" "$LOG_DIR/04-package-runtime-host.log"; then
            echo "Native Node/V8/Python source compilation was detected unexpectedly." >&2
            exit 1
          fi
          echo "Reused verified native RuntimeCore; no Node, V8, or Python source compilation was detected."

      - name: Run RuntimeCore link-closure regression tests
        run: |
          set -euxo pipefail
          node --test Scripts/Runtime/Tests/runtime-link-dependencies.test.mjs 2>&1 | tee "$LOG_DIR/04-runtime-link-tests.log"
          python3 -m unittest Scripts/Runtime/Tests/test_validate_app_dyld_closure.py -v 2>&1 | tee "$LOG_DIR/04-dyld-scanner-tests.log"

      - name: Verify pinned application-link archives
        run: |
          set -euxo pipefail
          archive_root="$(mktemp -d "$RUNNER_TEMP/runtime-link-archives.XXXXXX")"
          curl -fL --retry 3 \
            --output "$archive_root/libssh2-dynamic.xcframework.zip" \
            "https://github.com/holzschu/libssh2-apple/releases/download/v1.11.0/libssh2-dynamic.xcframework.zip"
          curl -fL --retry 3 \
            --output "$archive_root/openssl-dynamic.xcframework.zip" \
            "https://github.com/holzschu/openssl-apple/releases/download/v1.1.1w/openssl-dynamic.xcframework.zip"
          test "$(stat -f %z "$archive_root/libssh2-dynamic.xcframework.zip")" = "6378994"
          test "$(stat -f %z "$archive_root/openssl-dynamic.xcframework.zip")" = "13879626"
          test "$(swift package compute-checksum "$archive_root/libssh2-dynamic.xcframework.zip")" = "cacfe1789b197b727119f7e32f561eaf9acc27bf38cd19975b74fce107f868a6"
          test "$(swift package compute-checksum "$archive_root/openssl-dynamic.xcframework.zip")" = "329e8317cf9bee8e138da5d032330a7a1bd2473cf44c9c083cb2f0636abb8b80"

      - name: Validate expected project files
        run: |
          set -euxo pipefail

          {
            echo "Validating expected project structure..."

            test -d "$PROJECT_PATH"
            test -f "$PROJECT_PATH/project.pbxproj"
            test -d "AI_HLY"
            test -f "AI_HLY/AI_HLY.swift"
            test -f "AI_HLY/AI_HLY.entitlements"
            test -f "AI-HLY-Info.plist"
            test -f "Config.xcconfig"
            test -d "Vendor/NodeMobile/NodeMobile.xcframework"
            test -d "Vendor/Python/Python.xcframework"
            test -f "Vendor/Python/Python-VERSIONS"
            test -f "AI_HLY/RuntimeHostResources.zip"
            test -f "AI_HLY/Downstream/RuntimeCore/Resources/RuntimeManifest.json"

            echo
            echo "Required files exist."

            echo
            echo "===== Project directory ====="
            find "$PROJECT_PATH" -maxdepth 4 -type f | sort

            echo
            echo "===== App source sample ====="
            find AI_HLY -maxdepth 3 -type f | sort | sed -n '1,200p'
          } 2>&1 | tee "$LOG_DIR/04-validate-project.log"

      - name: Inspect Xcode project
        run: |
          set -euxo pipefail

          {
            echo "Running xcodebuild -list..."
            xcodebuild -list -project "$PROJECT_PATH"

            echo
            echo "Checking project settings by scheme..."
            xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -configuration "$CONFIGURATION" \
              -showBuildSettings \
              IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              | tee "$LOG_DIR/05-build-settings-full.log"

          } 2>&1 | tee "$LOG_DIR/05-inspect-project.log"

      - name: Resolve Swift Package dependencies
        run: |
          set -euxo pipefail

          {
            echo "Resolving Swift Package dependencies..."

            xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -resolvePackageDependencies \
              -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
              -skipPackagePluginValidation \
              -skipMacroValidation

            echo
            echo "===== Resolved packages folder ====="
            find "$CLONED_PACKAGES_PATH" -maxdepth 4 -type d | sort | sed -n '1,300p' || true

            echo
            echo "Swift Package dependency resolution completed."
          } 2>&1 | tee "$LOG_DIR/06-resolve-packages.log"

      - name: Save validated cloned Swift package dependencies
        uses: actions/cache/save@v6
        with:
          path: build/SourcePackages
          key: ${{ steps.app-sourcepackages-cache.outputs.cache-primary-key }}

      - name: Restore unchanged Xcode build input metadata
        run: |
          set -euxo pipefail
          python3 Scripts/CI/xcode_cache_inputs.py \
            --repository "$GITHUB_WORKSPACE" \
            restore \
            --manifest "$DERIVED_DATA_PATH/CacheMetadata/xcode-build-inputs.json" \
            2>&1 | tee "$LOG_DIR/06-cache-input-restore.log"

      - name: Capture Xcode build input metadata
        run: |
          set -euxo pipefail
          python3 Scripts/CI/xcode_cache_inputs.py \
            --repository "$GITHUB_WORKSPACE" \
            capture \
            --manifest "$DERIVED_DATA_PATH/CacheMetadata/xcode-build-inputs.json" \
            --head "$GITHUB_SHA" \
            --directory-root . \
            AI_HLY \
            AI_HLYTests \
            Packages \
            AI_HLY.xcodeproj \
            Config.xcconfig \
            RuntimeDependencies.lock.json \
            2>&1 | tee "$LOG_DIR/06-cache-input-capture.log"

      - name: Build unsigned iOS 26 app
        run: |
          set -euxo pipefail

          {
            echo "Starting unsigned iOS build..."
            echo "Project: $PROJECT_PATH"
            echo "Scheme: $SCHEME_NAME"
            echo "App name: $APP_NAME"
            echo "Configuration: $CONFIGURATION"
            echo "Deployment target override: iOS $IOS_DEPLOYMENT_TARGET"
            echo "DerivedData: $DERIVED_DATA_PATH"
            echo "Packages: $CLONED_PACKAGES_PATH"
            echo

            rm -rf "$LOG_DIR/BuildResult.xcresult"
            build_actions=(build)
            if [ "${{ inputs.force_clean_build }}" = "true" ]; then
              build_actions=(clean build)
            fi
            started_at="$(date +%s)"

            xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -configuration "$CONFIGURATION" \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
              -resultBundlePath "$LOG_DIR/BuildResult.xcresult" \
              -showBuildTimingSummary \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              DEVELOPMENT_TEAM="" \
              "${build_actions[@]}" 2>&1 | tee "$LOG_DIR/07-xcodebuild.raw.log"

            duration_seconds="$(( $(date +%s) - started_at ))"
            echo "$duration_seconds" > "$LOG_DIR/07-app-compilation-duration-seconds.txt"
            echo "Application compilation duration: ${duration_seconds}s"

            echo
            echo "Build command completed."
          } 2>&1 | tee "$LOG_DIR/07-build-step-wrapper.log"

      - name: Measure same-run device no-op rebuild
        if: ${{ inputs.measure_warm_rebuild }}
        run: |
          set -euxo pipefail
          rm -rf "$LOG_DIR/WarmBuildResult.xcresult"
          started_at="$(date +%s)"
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -resultBundlePath "$LOG_DIR/WarmBuildResult.xcresult" \
            -showBuildTimingSummary \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$LOG_DIR/07-warm-rebuild.log"
          duration_seconds="$(( $(date +%s) - started_at ))"
          echo "$duration_seconds" > "$LOG_DIR/07-warm-rebuild-duration-seconds.txt"
          echo "Same-run device no-op rebuild duration: ${duration_seconds}s"

      - name: Save successful incremental Xcode compiler state
        if: ${{ success() && !inputs.force_clean_build }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/DerivedData/Build
            build/DerivedData/ModuleCache.noindex
            build/DerivedData/SDKStatCaches.noindex
            build/DerivedData/CacheMetadata/xcode-build-inputs.json
          key: ${{ steps.app-deriveddata-cache.outputs.cache-primary-key }}

      - name: Locate built app
        run: |
          set -euxo pipefail

          {
            echo "Searching for built .app products..."

            find "$DERIVED_DATA_PATH" -name "*.app" -type d -print | sort | tee "$LOG_DIR/08-found-apps.txt"

            APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -path "*Release-iphoneos/*.app" -type d -print -quit || true)"

            if [ -z "$APP_PATH" ]; then
              echo "ERROR: No Release-iphoneos .app found."
              echo
              echo "Directory dump:"
              find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 5 -print || true
              exit 1
            fi

            echo "$APP_PATH" > "$LOG_DIR/app-path.txt"

            echo
            echo "Selected app path:"
            cat "$LOG_DIR/app-path.txt"

            echo
            echo "===== App bundle contents ====="
            find "$APP_PATH" -maxdepth 3 -print | sort | sed -n '1,400p'

            echo
            echo "===== RuntimeCore payload verification ====="
            test -f "$APP_PATH/Frameworks/NodeMobile.framework/NodeMobile"
            test -f "$APP_PATH/Frameworks/Python.framework/Python"
            test -d "$APP_PATH/python/lib/python3.14"
            test -f "$APP_PATH/RuntimeHostResources.zip"
            test -f "$APP_PATH/RuntimeManifest.json"
            test -f "$APP_PATH/RuntimeLinkDependencyNotices.txt"
            nm "$APP_PATH/$APP_NAME" | grep -E '(_ios_system$|_HanlinPythonExecute$|_HanlinNodeStart$)' | tee "$LOG_DIR/08-runtime-symbols.txt"

            echo
            echo "===== ios_system root resource verification ====="
            test -f "$APP_PATH/commandDictionary.plist"
            test -f "$APP_PATH/extraCommandsDictionary.plist"
            plutil -lint "$APP_PATH/commandDictionary.plist"
            plutil -lint "$APP_PATH/extraCommandsDictionary.plist"
            python3 Scripts/Runtime/validate_ios_system_resources.py \
              --repository-root . \
              --app "$APP_PATH" \
              --json-output "$LOG_DIR/08-ios-system-resources.json"
            cp "$APP_PATH/commandDictionary.plist" "$LOG_DIR/commandDictionary.plist"
            cp "$APP_PATH/extraCommandsDictionary.plist" "$LOG_DIR/extraCommandsDictionary.plist"

            echo
            echo "===== Complete Mach-O / dyld closure verification ====="
            test -f "$APP_PATH/Frameworks/libssh2.framework/libssh2"
            test -f "$APP_PATH/Frameworks/openssl.framework/openssl"
            test -f "$APP_PATH/Frameworks/curl_ios.framework/curl_ios"
            plutil -lint "$APP_PATH/Frameworks/libssh2.framework/Info.plist"
            plutil -lint "$APP_PATH/Frameworks/openssl.framework/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP_PATH/Frameworks/libssh2.framework/Info.plist")" = "libssh2"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP_PATH/Frameworks/openssl.framework/Info.plist")" = "openssl"
            lipo -archs "$APP_PATH/Frameworks/libssh2.framework/libssh2" | grep -qw arm64
            lipo -archs "$APP_PATH/Frameworks/openssl.framework/openssl" | grep -qw arm64
            vtool -show-build "$APP_PATH/Frameworks/libssh2.framework/libssh2" | tee "$LOG_DIR/08-libssh2-build-version.txt"
            vtool -show-build "$APP_PATH/Frameworks/openssl.framework/openssl" | tee "$LOG_DIR/08-openssl-build-version.txt"
            grep -Eq 'platform[[:space:]]+IOS$' "$LOG_DIR/08-libssh2-build-version.txt"
            grep -Eq 'platform[[:space:]]+IOS$' "$LOG_DIR/08-openssl-build-version.txt"
            otool -L "$APP_PATH/Frameworks/curl_ios.framework/curl_ios" | tee "$LOG_DIR/08-curl-ios-dependencies.txt"
            grep -Fq '@rpath/libssh2.framework/libssh2' "$LOG_DIR/08-curl-ios-dependencies.txt"
            grep -Fq '@rpath/openssl.framework/openssl' "$LOG_DIR/08-curl-ios-dependencies.txt"
            python3 Scripts/Runtime/validate-app-dyld-closure.py \
              --app "$APP_PATH" \
              --platform iphoneos \
              --json-output "$LOG_DIR/08-dyld-closure.json" \
              --text-output "$LOG_DIR/08-dyld-closure.txt"

            echo
            echo "===== App Info.plist ====="
            /usr/libexec/PlistBuddy -c "Print" "$APP_PATH/Info.plist" || true

            echo
            echo "===== Bundle metadata ====="
            echo "CFBundleIdentifier:"
            /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist" || true

            echo "CFBundleShortVersionString:"
            /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist" || true

            echo "CFBundleVersion:"
            /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist" || true

            echo "MinimumOSVersion:"
            /usr/libexec/PlistBuddy -c "Print MinimumOSVersion" "$APP_PATH/Info.plist" || true

          } 2>&1 | tee "$LOG_DIR/08-locate-app.log"

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          {
            APP_PATH="$(cat "$LOG_DIR/app-path.txt")"

            echo "Packaging unsigned IPA..."
            echo "App path: $APP_PATH"

            rm -rf Payload
            mkdir -p Payload

            cp -R "$APP_PATH" Payload/

            echo
            echo "===== Payload contents ====="
            find Payload -maxdepth 4 -print | sort | sed -n '1,400p'

            echo
            echo "Creating IPA: $IPA_NAME"
            /usr/bin/zip -qry "$IPA_NAME" Payload

            echo
            echo "===== IPA file ====="
            ls -lh "$IPA_NAME"

            echo
            echo "===== IPA zip listing sample ====="
            unzip -l "$IPA_NAME" | sed -n '1,200p'

            echo
            echo "Unsigned IPA packaged successfully."
          } 2>&1 | tee "$LOG_DIR/09-package-ipa.log"

      - name: Validate packaged IPA dyld closure
        run: |
          set -euxo pipefail
          packaged_root="$(mktemp -d "$RUNNER_TEMP/packaged-ipa.XXXXXX")"
          ditto -x -k "$IPA_NAME" "$packaged_root"
          PACKAGED_APP_PATH="$(find "$packaged_root/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$PACKAGED_APP_PATH"
          python3 Scripts/Runtime/validate-app-dyld-closure.py \
            --app "$PACKAGED_APP_PATH" \
            --platform iphoneos \
            --json-output "$LOG_DIR/09-packaged-ipa-dyld-closure.json" \
            --text-output "$LOG_DIR/09-packaged-ipa-dyld-closure.txt"
          test -f "$PACKAGED_APP_PATH/commandDictionary.plist"
          test -f "$PACKAGED_APP_PATH/extraCommandsDictionary.plist"
          plutil -lint "$PACKAGED_APP_PATH/commandDictionary.plist"
          plutil -lint "$PACKAGED_APP_PATH/extraCommandsDictionary.plist"
          python3 Scripts/Runtime/validate_ios_system_resources.py \
            --repository-root . \
            --app "$PACKAGED_APP_PATH" \
            --json-output "$LOG_DIR/09-packaged-ios-system-resources.json"
          SOURCE_APP_PATH="$(cat "$LOG_DIR/app-path.txt")"
          test "$(shasum -a 256 "$SOURCE_APP_PATH/commandDictionary.plist" | awk '{print $1}')" \
            = "$(shasum -a 256 "$PACKAGED_APP_PATH/commandDictionary.plist" | awk '{print $1}')"
          test "$(shasum -a 256 "$SOURCE_APP_PATH/extraCommandsDictionary.plist" | awk '{print $1}')" \
            = "$(shasum -a 256 "$PACKAGED_APP_PATH/extraCommandsDictionary.plist" | awk '{print $1}')"
          stat -f %z "$IPA_NAME" | tee "$LOG_DIR/09-ipa-size-bytes.txt"
          shasum -a 256 "$IPA_NAME" | tee "$LOG_DIR/09-ipa-sha256.txt"

      - name: Create diagnostic summary
        if: always()
        run: |
          set +e

          SUMMARY_FILE="$LOG_DIR/00-summary.txt"

          {
            echo "===== Build diagnostic summary ====="
            echo "Date: $(date)"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner name: $RUNNER_NAME"

            echo
            echo "===== Selected Xcode ====="
            xcode-select -p
            xcodebuild -version

            echo
            echo "===== SDKs ====="
            xcodebuild -showsdks

            echo
            echo "===== Project ====="
            echo "PROJECT_PATH=$PROJECT_PATH"
            echo "SCHEME_NAME=$SCHEME_NAME"
            echo "APP_NAME=$APP_NAME"
            echo "CONFIGURATION=$CONFIGURATION"
            echo "IOS_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET"

            echo
            echo "===== Incremental build evidence ====="
            cat "$LOG_DIR/02-cache-mode.log" 2>/dev/null || echo "Cache mode unavailable."
            echo "Compilation duration (seconds): $(cat "$LOG_DIR/07-app-compilation-duration-seconds.txt" 2>/dev/null || echo unavailable)"
            grep -A 80 -F 'Build Timing Summary' "$LOG_DIR/07-xcodebuild.raw.log" 2>/dev/null || true

            echo
            echo "===== IPA ====="
            if [ -f "$IPA_NAME" ]; then
              ls -lh "$IPA_NAME"
              echo "Size (bytes): $(cat "$LOG_DIR/09-ipa-size-bytes.txt" 2>/dev/null || echo unavailable)"
              echo "SHA-256: $(cat "$LOG_DIR/09-ipa-sha256.txt" 2>/dev/null || echo unavailable)"
            else
              echo "IPA was not created."
            fi

            echo
            echo "===== Found apps ====="
            cat "$LOG_DIR/08-found-apps.txt" 2>/dev/null || echo "No found-apps file."

            echo
            echo "===== Last 200 lines of raw xcodebuild log ====="
            tail -200 "$LOG_DIR/07-xcodebuild.raw.log" 2>/dev/null || echo "No raw xcodebuild log."

          } > "$SUMMARY_FILE" 2>&1

          cat "$SUMMARY_FILE"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Hanlin-iOS26-unsigned-ipa
          path: AI_Hanlin-iOS26-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Hanlin-iOS26-build-logs
          path: |
            build-logs
          if-no-files-found: warn
          retention-days: 14

  full-app-simulator-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.runtime_bundle_only && !inputs.phase1_validation_only }}
    name: Script Package Production E2E and host-app smoke - iPad Simulator
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT_PATH: AI_HLY.xcodeproj
      SCHEME_NAME: AI_HLY
      CONFIGURATION: ${{ (inputs.validation_mode == 'simulator-only' || inputs.fast_validation_only || inputs.script_restart_repro_only) && 'Debug' || 'Release' }}
      DERIVED_DATA_PATH: build/SimulatorDerivedData
      CLONED_PACKAGES_PATH: build/SourcePackages
      LOG_DIR: simulator-logs
      IOS_DEPLOYMENT_TARGET: "26.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned RuntimeCore host Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0
          cache: npm
          cache-dependency-path: AI_HLY/Downstream/RuntimeCore/Node/Host/package-lock.json

      - name: Prepare simulator logs and select stable Xcode 26
        id: simulator-toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$LOG_DIR" build
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print \
            | grep -E '/Xcode_26([._][0-9]+)*\.app$' \
            | sort -V \
            | tail -1)"
          test -n "$selected_xcode"
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          {
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcodebuild -showsdks
          } 2>&1 | tee "$LOG_DIR/01-environment.log"
          xcodebuild -showsdks | grep -E 'iphonesimulator26|iOS Simulator 26'
          echo "xcode-version=$(xcodebuild -version | sed -n '1s/^Xcode //p')" >> "$GITHUB_OUTPUT"
          echo "xcode-build=$(xcodebuild -version | sed -n '2s/^Build version //p')" >> "$GITHUB_OUTPUT"
          echo "runner-arch=$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "simulator-sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "$GITHUB_OUTPUT"

      - name: Restore simulator cloned Swift package dependencies
        id: simulator-sourcepackages-cache
        uses: actions/cache/restore@v6
        with:
          path: build/SourcePackages
          key: ios-sourcepackages-v1-${{ runner.os }}-${{ steps.simulator-toolchain.outputs.runner-arch }}-${{ steps.simulator-toolchain.outputs.xcode-build }}-${{ hashFiles('AI_HLY.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/HanlinPlatform/Package.swift', 'Packages/HanlinQuickJS/Package.swift', 'Packages/IOSSystemLite/Package.swift') }}
          restore-keys: |
            ios-sourcepackages-v1-${{ runner.os }}-${{ steps.simulator-toolchain.outputs.runner-arch }}-${{ steps.simulator-toolchain.outputs.xcode-build }}-

      - name: Restore compatible simulator compiler state
        if: ${{ !inputs.force_clean_build }}
        id: simulator-deriveddata-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/SimulatorDerivedData/Build
            build/SimulatorDerivedData/ModuleCache.noindex
            build/SimulatorDerivedData/SDKStatCaches.noindex
            build/SimulatorDerivedData/CacheMetadata/xcode-build-inputs.json
          key: ios-derived-v2-${{ runner.os }}-${{ steps.simulator-toolchain.outputs.runner-arch }}-${{ steps.simulator-toolchain.outputs.xcode-build }}-iphonesimulator-${{ steps.simulator-toolchain.outputs.simulator-sdk }}-${{ env.CONFIGURATION }}-${{ hashFiles('AI_HLY.xcodeproj/project.pbxproj', 'AI_HLY.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/HanlinPlatform/Package.swift', 'Packages/HanlinQuickJS/Package.swift', 'Packages/IOSSystemLite/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-v2-${{ runner.os }}-${{ steps.simulator-toolchain.outputs.runner-arch }}-${{ steps.simulator-toolchain.outputs.xcode-build }}-iphonesimulator-${{ steps.simulator-toolchain.outputs.simulator-sdk }}-${{ env.CONFIGURATION }}-${{ hashFiles('AI_HLY.xcodeproj/project.pbxproj', 'AI_HLY.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/HanlinPlatform/Package.swift', 'Packages/HanlinQuickJS/Package.swift', 'Packages/IOSSystemLite/Package.swift') }}-

      - name: Report simulator cache mode
        run: |
          set -euo pipefail
          cache_state() {
            if [ "$1" = "true" ]; then echo exact-hit
            elif [ -n "$2" ]; then echo fallback-hit
            else echo miss
            fi
          }
          if [ "${{ inputs.force_clean_build }}" = "true" ]; then
            build_mode=forced-clean
          elif [ -n "${{ steps.simulator-deriveddata-cache.outputs.cache-matched-key }}" ]; then
            build_mode=restored-incremental
          else
            build_mode=cold
          fi
          {
            echo "force_clean_build=${{ inputs.force_clean_build }}"
            echo "SourcePackages=$(cache_state '${{ steps.simulator-sourcepackages-cache.outputs.cache-hit }}' '${{ steps.simulator-sourcepackages-cache.outputs.cache-matched-key }}')"
            echo "DerivedData=$(cache_state '${{ steps.simulator-deriveddata-cache.outputs.cache-hit }}' '${{ steps.simulator-deriveddata-cache.outputs.cache-matched-key }}')"
            echo "build_mode=$build_mode"
            echo "selected_xcode=${{ steps.simulator-toolchain.outputs.xcode-version }}"
            echo "selected_xcode_build=${{ steps.simulator-toolchain.outputs.xcode-build }}"
            echo "runner_arch=${{ steps.simulator-toolchain.outputs.runner-arch }}"
            echo "iphonesimulator_sdk=${{ steps.simulator-toolchain.outputs.simulator-sdk }}"
          } | tee "$LOG_DIR/01-cache-mode.log"

      - name: Discard simulator compiler state for forced clean build
        if: ${{ inputs.force_clean_build }}
        run: |
          set -euxo pipefail
          echo "FORCED CLEAN BUILD: discarding simulator DerivedData without discarding dependency downloads."
          rm -rf "$DERIVED_DATA_PATH"

      - name: Create CI Config.xcconfig
        run: |
          set -euxo pipefail
          cat > Config.xcconfig <<'EOF'
          // Generated by GitHub Actions for CI builds.
          // Do not commit secrets here.

          HANLIN_API_KEY =
          HANLIN_OPEN_API_KEY =
          EOF

      - name: Prepare verified embedded RuntimeCore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          bash Scripts/Runtime/prepare-runtime-core.sh 2>&1 | tee "$LOG_DIR/02-prepare-runtime-core.log"
          grep -Fq "Prepared verified RuntimeCore 7d967563db0809a4efa0f07b75d6b5928379a3b6f3aafb886899a79f59512a93" "$LOG_DIR/02-prepare-runtime-core.log"

      - name: Package current RuntimeCore host resources
        run: |
          set -euxo pipefail
          bash Scripts/Runtime/prepare-runtime-host.sh 2>&1 | tee "$LOG_DIR/03-package-runtime-host.log"
          cp build/runtime-host/RuntimeHostResources.zip AI_HLY/RuntimeHostResources.zip

      - name: Run RuntimeCore preflight
        run: |
          set -euxo pipefail
          bash Scripts/Runtime/preflight-runtime-core.sh 2>&1 | tee "$LOG_DIR/04-runtime-preflight.log"

      - name: Resolve Swift Package dependencies
        run: |
          set -euxo pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee "$LOG_DIR/05-resolve-packages.log"

      - name: Save validated simulator Swift package dependencies
        uses: actions/cache/save@v6
        with:
          path: build/SourcePackages
          key: ${{ steps.simulator-sourcepackages-cache.outputs.cache-primary-key }}

      - name: Restore unchanged simulator build input metadata
        run: |
          set -euxo pipefail
          python3 Scripts/CI/xcode_cache_inputs.py \
            --repository "$GITHUB_WORKSPACE" \
            restore \
            --manifest "$DERIVED_DATA_PATH/CacheMetadata/xcode-build-inputs.json" \
            2>&1 | tee "$LOG_DIR/05-cache-input-restore.log"

      - name: Capture simulator build input metadata
        run: |
          set -euxo pipefail
          python3 Scripts/CI/xcode_cache_inputs.py \
            --repository "$GITHUB_WORKSPACE" \
            capture \
            --manifest "$DERIVED_DATA_PATH/CacheMetadata/xcode-build-inputs.json" \
            --head "$GITHUB_SHA" \
            --directory-root . \
            AI_HLY \
            AI_HLYTests \
            Packages \
            AI_HLY.xcodeproj \
            Config.xcconfig \
            RuntimeDependencies.lock.json \
            2>&1 | tee "$LOG_DIR/05-cache-input-capture.log"

      - name: Build full arm64 simulator app
        run: |
          set -euxo pipefail
          rm -rf "$LOG_DIR/SimulatorBuildResult.xcresult"
          build_actions=(build)
          if [ "${{ inputs.force_clean_build }}" = "true" ]; then
            build_actions=(clean build)
          fi
          started_at="$(date +%s)"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -resultBundlePath "$LOG_DIR/SimulatorBuildResult.xcresult" \
            -showBuildTimingSummary \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ENABLE_TESTABILITY=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            "${build_actions[@]}" 2>&1 | tee "$LOG_DIR/06-xcodebuild-simulator.log"
          echo "$(( $(date +%s) - started_at ))" > "$LOG_DIR/06-app-compilation-duration-seconds.txt"
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products" -path "*${CONFIGURATION}-iphonesimulator/*.app" -type d -print -quit)"
          test -n "$APP_PATH"
          rm -rf build/SimulatorRuntimeApp
          mkdir -p build/SimulatorRuntimeApp
          ditto "$APP_PATH" build/SimulatorRuntimeApp/AI_Hanlin.app
          # A restored DerivedData cache can leave the downstream test bundle in
          # the product app. Keep the runtime copy representative of the shipped
          # application before validating its dyld closure and launching it.
          rm -rf build/SimulatorRuntimeApp/AI_Hanlin.app/PlugIns/AI_HLYTests.xctest
          test ! -e build/SimulatorRuntimeApp/AI_Hanlin.app/PlugIns/AI_HLYTests.xctest

      - name: Measure same-run simulator no-op rebuild
        if: ${{ inputs.measure_warm_rebuild }}
        run: |
          set -euxo pipefail
          rm -rf "$LOG_DIR/SimulatorWarmBuildResult.xcresult"
          started_at="$(date +%s)"
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -resultBundlePath "$LOG_DIR/SimulatorWarmBuildResult.xcresult" \
            -showBuildTimingSummary \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ENABLE_TESTABILITY=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$LOG_DIR/06-warm-rebuild.log"
          duration_seconds="$(( $(date +%s) - started_at ))"
          echo "$duration_seconds" > "$LOG_DIR/06-warm-rebuild-duration-seconds.txt"
          echo "Same-run simulator no-op rebuild duration: ${duration_seconds}s"

      - name: Build downstream unit tests
        run: |
          set -euxo pipefail
          rm -rf "$LOG_DIR/DownstreamTestsBuildResult.xcresult"
          started_at="$(date +%s)"
          xcodebuild build-for-testing \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -resultBundlePath "$LOG_DIR/DownstreamTestsBuildResult.xcresult" \
            -showBuildTimingSummary \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:AI_HLYTests \
            ENABLE_TESTABILITY=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$LOG_DIR/06-downstream-test-build.log"
          echo "$(( $(date +%s) - started_at ))" > "$LOG_DIR/06-downstream-test-build-duration-seconds.txt"

      - name: Save successful simulator compiler state
        if: ${{ success() && !inputs.force_clean_build }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/SimulatorDerivedData/Build
            build/SimulatorDerivedData/ModuleCache.noindex
            build/SimulatorDerivedData/SDKStatCaches.noindex
            build/SimulatorDerivedData/CacheMetadata/xcode-build-inputs.json
          key: ${{ steps.simulator-deriveddata-cache.outputs.cache-primary-key }}

      - name: Locate and scan simulator app
        run: |
          set -euxo pipefail
          APP_PATH="build/SimulatorRuntimeApp/AI_Hanlin.app"
          test -d "$APP_PATH"
          echo "$APP_PATH" > "$LOG_DIR/app-path.txt"
          test -f "$APP_PATH/Frameworks/libssh2.framework/libssh2"
          test -f "$APP_PATH/Frameworks/openssl.framework/openssl"
          test -f "$APP_PATH/Frameworks/curl_ios.framework/curl_ios"
          test -f "$APP_PATH/commandDictionary.plist"
          test -f "$APP_PATH/extraCommandsDictionary.plist"
          plutil -lint "$APP_PATH/commandDictionary.plist"
          plutil -lint "$APP_PATH/extraCommandsDictionary.plist"
          python3 Scripts/Runtime/validate_ios_system_resources.py \
            --repository-root . \
            --app "$APP_PATH" \
            --json-output "$LOG_DIR/07-simulator-ios-system-resources.json"
          cp "$APP_PATH/commandDictionary.plist" "$LOG_DIR/commandDictionary.plist"
          cp "$APP_PATH/extraCommandsDictionary.plist" "$LOG_DIR/extraCommandsDictionary.plist"
          find "$APP_PATH" -maxdepth 4 -print | sort > "$LOG_DIR/07-built-app-resources.txt"
          if [ "${{ inputs.validation_mode }}" != "simulator-only" ] \
            && [ "${{ inputs.fast_validation_only }}" != "true" ]; then
            python3 Scripts/Runtime/validate-app-dyld-closure.py \
              --app "$APP_PATH" \
              --platform iphonesimulator \
              --json-output "$LOG_DIR/07-simulator-dyld-closure.json" \
              --text-output "$LOG_DIR/07-simulator-dyld-closure.txt"
          else
            printf '%s\n' \
              "Skipped production dyld-closure validation for the Debug fast-validation app." \
              > "$LOG_DIR/07-simulator-dyld-closure-skipped.txt"
          fi

      - name: Boot iPad Simulator and launch full app
        run: |
          set -euxo pipefail
          APP_PATH="$(cat "$LOG_DIR/app-path.txt")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP_PATH/Info.plist")"
          selection="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS-26" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPad" in device.get("name", ""):
                      candidates.append((runtime, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iOS 26 iPad simulator was found")
          runtime, name, udid = sorted(candidates, reverse=True)[0]
          print(f"{udid}\t{name}\t{runtime}")
          PY
          )"
          IFS=$'\t' read -r SIMULATOR_UDID SIMULATOR_MODEL SIMULATOR_RUNTIME <<< "$selection"
          test -n "$SIMULATOR_UDID"
          printf '%s\n' "$SIMULATOR_UDID" > "$LOG_DIR/simulator-udid.txt"
          printf '%s\n' "$SIMULATOR_MODEL" > "$LOG_DIR/simulator-model.txt"
          printf '%s\n' "$SIMULATOR_RUNTIME" > "$LOG_DIR/simulator-runtime.txt"
          printf '%s\n' "$BUNDLE_ID" > "$LOG_DIR/bundle-id.txt"
          printf '%s\n' "$APP_EXECUTABLE" > "$LOG_DIR/app-executable.txt"

          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>&1 | tee "$LOG_DIR/08-bootstatus.log"
          if [ "${{ inputs.validation_mode }}" != "simulator-only" ]; then
            rm -rf "$LOG_DIR/DownstreamTestsResult.xcresult"
            started_at="$(date +%s)"
            set +e
            xcodebuild test-without-building \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -configuration "$CONFIGURATION" \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
              -resultBundlePath "$LOG_DIR/DownstreamTestsResult.xcresult" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              -only-testing:AI_HLYTests \
              2>&1 | tee "$LOG_DIR/08-downstream-unit-tests.log"
            downstream_test_status="${PIPESTATUS[0]}"
            set -e
            echo "$(( $(date +%s) - started_at ))" > "$LOG_DIR/08-downstream-unit-tests-duration-seconds.txt"
            if [ "$downstream_test_status" -ne 0 ]; then
              xcrun xcresulttool get test-results tests \
                --path "$LOG_DIR/DownstreamTestsResult.xcresult" \
                --format json \
                | tee "$LOG_DIR/08-downstream-unit-test-results.json" || true
              exit "$downstream_test_status"
            fi
            rm -rf "$LOG_DIR/ScriptingAcceptanceResult.xcresult"
            scripting_started_at="$(date +%s)"
            xcodebuild test-without-building \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -configuration "$CONFIGURATION" \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
              -resultBundlePath "$LOG_DIR/ScriptingAcceptanceResult.xcresult" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              -only-testing:AI_HLYTests/HanlinScriptingAcceptanceTests \
              2>&1 | tee "$LOG_DIR/08-scripting-acceptance.log"
            echo "$(( $(date +%s) - scripting_started_at ))" > "$LOG_DIR/08-scripting-acceptance-duration-seconds.txt"
          else
            printf '%s\n' \
              "Skipped unrelated downstream suites in focused simulator-only validation." \
              > "$LOG_DIR/08-focused-validation.txt"
          fi
          rm -rf "$LOG_DIR/ScriptPackageProductionE2EResult.xcresult"
          package_e2e_started_at="$(date +%s)"
          package_test_selector="AI_HLYTests/HanlinScriptPackageProductionE2ETests"
          if [ "${{ inputs.script_restart_repro_only }}" = "true" ]; then
            package_test_selector="AI_HLYTests/HanlinScriptPackagePhysicalIPadRegressionTests"
          fi
          set +e
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_PACKAGES_PATH" \
            -resultBundlePath "$LOG_DIR/ScriptPackageProductionE2EResult.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:"$package_test_selector" \
            2>&1 | tee "$LOG_DIR/08-script-package-production-e2e.log"
          package_e2e_status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "$package_e2e_status" > "$LOG_DIR/08-script-package-production-e2e-status.txt"
          echo "$(( $(date +%s) - package_e2e_started_at ))" > "$LOG_DIR/08-script-package-production-e2e-duration-seconds.txt"
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>&1 \
            | tee "$LOG_DIR/08-post-tests-bootstatus.log"
          xcrun simctl uninstall "$SIMULATOR_UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          touch "$LOG_DIR/launch-marker"

          cleanup() {
            xcrun simctl terminate "$SIMULATOR_UDID" "$BUNDLE_ID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if [ "${{ inputs.script_restart_repro_only }}" = "true" ]; then
            bash Scripts/CI/script-app-node-restart-repro.sh \
              "$LOG_DIR" "$SIMULATOR_UDID" "$BUNDLE_ID" "$package_e2e_status"
            trap - EXIT
            exit 0
          fi

          if [ "${{ inputs.validation_mode }}" = "simulator-only" ] \
            || [ "${{ inputs.fast_validation_only }}" = "true" ]; then
            set +e
            xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID" 2>&1 \
              | tee "$LOG_DIR/08-fast-launch-output.txt"
            launch_status=${PIPESTATUS[0]}
            set -e
            test "$launch_status" -eq 0
            APP_PID="$(awk -F ': ' -v bundle="$BUNDLE_ID" '$1 == bundle { print $2 }' "$LOG_DIR/08-fast-launch-output.txt" | tail -1)"
            test -n "$APP_PID"
            printf '%s\n' "$APP_PID" > "$LOG_DIR/launch-pid.txt"
            for elapsed in $(seq 1 15); do
              xcrun simctl spawn "$SIMULATOR_UDID" launchctl print "pid/$APP_PID" >/dev/null
              sleep 1
            done
            xcrun simctl spawn "$SIMULATOR_UDID" log show \
              --style compact \
              --last 2m \
              --predicate "processID == $APP_PID" \
              > "$LOG_DIR/08-application.log" 2>&1 || true
            printf '%s\n' "15" > "$LOG_DIR/alive-duration-seconds.txt"
            printf '%s\n' "script-package-production-e2e-and-host-smoke" > "$LOG_DIR/validation-profile.txt"
            trap - EXIT
            cleanup
            exit 0
          fi

          set +e
          SIMCTL_CHILD_HANLIN_CANONICAL_SHADOW_CHECKS=1 \
          SIMCTL_CHILD_HANLIN_RUNTIME_ACCEPTANCE=shell \
            xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID" 2>&1 | tee "$LOG_DIR/08-launch-output.txt"
          launch_status=${PIPESTATUS[0]}
          set -e
          test "$launch_status" -eq 0
          APP_PID="$(awk -F ': ' -v bundle="$BUNDLE_ID" '$1 == bundle { print $2 }' "$LOG_DIR/08-launch-output.txt" | tail -1)"
          test -n "$APP_PID"
          printf '%s\n' "$APP_PID" > "$LOG_DIR/launch-pid.txt"
          LAUNCH_EPOCH="$(date +%s)"
          DATA_CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$BUNDLE_ID" data)"
          ACCEPTANCE_PATH="$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/logs/shell-acceptance.json"
          SHELL_LOG_PATH="$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/logs/shell-runtime.log"
          for elapsed in $(seq 1 120); do
            if [ -f "$ACCEPTANCE_PATH" ]; then
              break
            fi
            if ! xcrun simctl spawn "$SIMULATOR_UDID" launchctl print "pid/$APP_PID" >/dev/null 2>&1; then
              echo "Full app exited before writing shell acceptance JSON after ${elapsed} seconds." >&2
              exit 1
            fi
            sleep 1
          done
          test -f "$ACCEPTANCE_PATH"
          cp "$ACCEPTANCE_PATH" "$LOG_DIR/shell-acceptance.json"
          test -f "$SHELL_LOG_PATH"
          cp "$SHELL_LOG_PATH" "$LOG_DIR/shell-runtime.log"
          python3 Scripts/Runtime/validate_shell_acceptance.py \
            "$LOG_DIR/shell-acceptance.json" \
            --summary-output "$LOG_DIR/08-shell-acceptance-summary.json" \
            | tee "$LOG_DIR/08-shell-acceptance.log"
          python3 - "$LOG_DIR/shell-acceptance.json" <<'PY' | tee "$LOG_DIR/08-shell-canonical-shadow.log"
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          report = payload.get("canonicalShadow")
          if report is None:
              raise SystemExit("Shell acceptance did not emit canonical shadow evidence")
          domains = {item["domain"]: item for item in report["domains"]}
          if report["summary"]["mismatchCount"] != 0:
              raise SystemExit("Shell canonical shadow reported a mismatch")
          if domains.get("runtime.core", {}).get("status") != "passed":
              raise SystemExit("Shell RuntimeCore canonical shadow did not pass")
          print(
              "HANLIN_CANONICAL_SHADOW_CI acceptance=shell "
              f"passed={report['summary']['passedCount']} "
              f"warnings={report['summary']['warningCount']} "
              f"mismatches={report['summary']['mismatchCount']} "
              f"skipped={report['summary']['skippedCount']}"
          )
          PY

          ALIVE_SECONDS="$(( $(date +%s) - LAUNCH_EPOCH ))"
          while [ "$ALIVE_SECONDS" -lt 15 ]; do
            xcrun simctl spawn "$SIMULATOR_UDID" launchctl print "pid/$APP_PID" >/dev/null
            sleep 1
            ALIVE_SECONDS="$(( $(date +%s) - LAUNCH_EPOCH ))"
          done
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl print "pid/$APP_PID" >/dev/null
          printf '%s\n' "$ALIVE_SECONDS" > "$LOG_DIR/alive-duration-seconds.txt"

          xcrun simctl spawn "$SIMULATOR_UDID" log show \
            --style compact \
            --last 5m \
            --predicate "processID == $APP_PID" \
            > "$LOG_DIR/08-application.log" 2>&1 || true

          : > "$LOG_DIR/08-new-diagnostic-reports.txt"
          for diagnostic_root in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/CrashReporter" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/DiagnosticReports"; do
            if [ -d "$diagnostic_root" ]; then
              find "$diagnostic_root" -type f -newer "$LOG_DIR/launch-marker" -print \
                >> "$LOG_DIR/08-new-diagnostic-reports.txt"
            fi
          done
          while IFS= read -r diagnostic_report; do
            report_name="$(basename "$diagnostic_report")"
            case "$report_name" in
              "$APP_EXECUTABLE"*|"$BUNDLE_ID"*)
                echo "Full app generated crash report: $diagnostic_report" >&2
                exit 1
                ;;
            esac
          done < "$LOG_DIR/08-new-diagnostic-reports.txt"

          xcrun simctl terminate "$SIMULATOR_UDID" "$BUNDLE_ID" 2>/dev/null || true

          MCP_ACCEPTANCE_PATH="$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/logs/mcp-acceptance.json"
          MCP_RUNTIME_LOG_PATH="$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/logs/node-runtime.log"
          rm -f "$MCP_ACCEPTANCE_PATH"
          touch "$LOG_DIR/mcp-launch-marker"
          set +e
          SIMCTL_CHILD_HANLIN_CANONICAL_SHADOW_CHECKS=1 \
          SIMCTL_CHILD_HANLIN_RUNTIME_ACCEPTANCE=mcp \
            xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID" 2>&1 | tee "$LOG_DIR/08-mcp-launch-output.txt"
          mcp_launch_status=${PIPESTATUS[0]}
          set -e
          test "$mcp_launch_status" -eq 0
          MCP_APP_PID="$(awk -F ': ' -v bundle="$BUNDLE_ID" '$1 == bundle { print $2 }' "$LOG_DIR/08-mcp-launch-output.txt" | tail -1)"
          test -n "$MCP_APP_PID"
          printf '%s\n' "$MCP_APP_PID" > "$LOG_DIR/mcp-launch-pid.txt"
          for elapsed in $(seq 1 360); do
            if [ -f "$MCP_ACCEPTANCE_PATH" ]; then
              break
            fi
            if ! xcrun simctl spawn "$SIMULATOR_UDID" launchctl print "pid/$MCP_APP_PID" >/dev/null 2>&1; then
              echo "Full app exited before writing MCP acceptance JSON after ${elapsed} seconds." >&2
              exit 1
            fi
            sleep 1
          done
          test -f "$MCP_ACCEPTANCE_PATH"
          cp "$MCP_ACCEPTANCE_PATH" "$LOG_DIR/mcp-acceptance.json"
          test -f "$MCP_RUNTIME_LOG_PATH"
          cp "$MCP_RUNTIME_LOG_PATH" "$LOG_DIR/node-runtime.log"
          python3 Scripts/Runtime/validate_mcp_acceptance.py \
            "$LOG_DIR/mcp-acceptance.json" \
            --summary-output "$LOG_DIR/08-mcp-acceptance-summary.json" \
            | tee "$LOG_DIR/08-mcp-acceptance.log"
          COMPATIBILITY_REPORT="$(find "$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/packages/mcp" -name compatibility-report.json -type f -print -quit)"
          test -n "$COMPATIBILITY_REPORT"
          cp "$COMPATIBILITY_REPORT" "$LOG_DIR/server-everything-compatibility-report.json"
          python3 - "$LOG_DIR/mcp-acceptance.json" <<'PY' | tee "$LOG_DIR/08-mcp-canonical-shadow.log"
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          report = payload.get("canonicalShadow")
          if report is None:
              raise SystemExit("MCP acceptance did not emit canonical shadow evidence")
          domains = {item["domain"]: item for item in report["domains"]}
          if report["summary"]["mismatchCount"] != 0:
              raise SystemExit("MCP canonical shadow reported a mismatch")
          for domain in ("native.tools", "mcp", "runtime.core", "cross-domain.tools"):
              if domains.get(domain, {}).get("status") != "passed":
                  raise SystemExit(f"{domain} canonical shadow did not pass")
          print(
              "HANLIN_CANONICAL_SHADOW_CI acceptance=mcp "
              f"passed={report['summary']['passedCount']} "
              f"warnings={report['summary']['warningCount']} "
              f"mismatches={report['summary']['mismatchCount']} "
              f"skipped={report['summary']['skippedCount']}"
          )
          PY
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl print "pid/$MCP_APP_PID" >/dev/null
          xcrun simctl terminate "$SIMULATOR_UDID" "$BUNDLE_ID" 2>/dev/null || true

          : > "$LOG_DIR/08-mcp-new-diagnostic-reports.txt"
          for diagnostic_root in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/CrashReporter" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/DiagnosticReports"; do
            if [ -d "$diagnostic_root" ]; then
              find "$diagnostic_root" -type f -newer "$LOG_DIR/mcp-launch-marker" -print \
                >> "$LOG_DIR/08-mcp-new-diagnostic-reports.txt"
            fi
          done
          while IFS= read -r diagnostic_report; do
            report_name="$(basename "$diagnostic_report")"
            case "$report_name" in
              "$APP_EXECUTABLE"*|"$BUNDLE_ID"*)
                echo "MCP acceptance generated crash report: $diagnostic_report" >&2
                exit 1
                ;;
            esac
          done < "$LOG_DIR/08-mcp-new-diagnostic-reports.txt"
          trap - EXIT

      - name: Collect simulator diagnostics
        if: always()
        run: |
          set +e
          for result in "$LOG_DIR"/*.xcresult; do
            [ -d "$result" ] || continue
            result_name="$(basename "$result" .xcresult)"
            xcrun xcresulttool get test-results tests \
              --path "$result" \
              --format json \
              > "$LOG_DIR/${result_name}-test-results.json" 2>/dev/null || true
          done
          if [ -f "$LOG_DIR/simulator-udid.txt" ]; then
            SIMULATOR_UDID="$(cat "$LOG_DIR/simulator-udid.txt")"
            xcrun simctl io "$SIMULATOR_UDID" screenshot "$LOG_DIR/09-final-simulator-screen.png" \
              2>"$LOG_DIR/09-screenshot-error.log" || true
            xcrun simctl spawn "$SIMULATOR_UDID" log show --style compact --last 10m \
              > "$LOG_DIR/09-simulator-system.log" 2>&1 || true
            if [ -f "$LOG_DIR/bundle-id.txt" ]; then
              BUNDLE_ID="$(cat "$LOG_DIR/bundle-id.txt")"
              DATA_CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$BUNDLE_ID" data 2>/dev/null || true)"
              if [ -n "$DATA_CONTAINER" ]; then
                cp "$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/logs/shell-acceptance.json" \
                  "$LOG_DIR/shell-acceptance.json" 2>/dev/null || true
                cp "$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/logs/shell-runtime.log" \
                  "$LOG_DIR/shell-runtime.log" 2>/dev/null || true
                cp "$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/logs/mcp-acceptance.json" \
                  "$LOG_DIR/mcp-acceptance.json" 2>/dev/null || true
                cp "$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/logs/node-runtime.log" \
                  "$LOG_DIR/node-runtime.log" 2>/dev/null || true
                find "$DATA_CONTAINER/Library/Application Support/HanlinRuntime/v1/packages/mcp" \
                  -name compatibility-report.json -type f -exec cp {} "$LOG_DIR/server-everything-compatibility-report.json" \; \
                  2>/dev/null || true
              fi
            fi
            mkdir -p "$LOG_DIR/DiagnosticReports"
            for diagnostic_root in \
              "$HOME/Library/Logs/DiagnosticReports" \
              "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/CrashReporter" \
              "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/DiagnosticReports"; do
              if [ -d "$diagnostic_root" ]; then
                find "$diagnostic_root" -type f -newer "$LOG_DIR/launch-marker" -exec cp -p {} "$LOG_DIR/DiagnosticReports/" \; 2>/dev/null || true
              fi
            done
          fi
          if [ -d "$LOG_DIR/script-app-node-restart-repro" ] \
            && [ -d "$LOG_DIR/ScriptPackageProductionE2EResult.xcresult" ]; then
            ditto "$LOG_DIR/ScriptPackageProductionE2EResult.xcresult" \
              "$LOG_DIR/script-app-node-restart-repro/ScriptPackageProductionE2EResult.xcresult"
          fi

      - name: Upload simulator production E2E and host smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Hanlin-iOS26-script-package-production-e2e
          path: simulator-logs
          if-no-files-found: error
          retention-days: 14

      - name: Upload Script App Node restart reproduction evidence
        if: ${{ always() && inputs.script_restart_repro_only }}
        uses: actions/upload-artifact@v4
        with:
          name: script-app-node-restart-repro
          path: simulator-logs/script-app-node-restart-repro
          if-no-files-found: warn
          retention-days: 14
