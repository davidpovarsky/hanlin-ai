name: Validate NativeScript SDK metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: Scripts/NativeScript/package-lock.json
      - name: Select installed stable Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' -print | grep -E '/Xcode_27([._][0-9]+)*\.app$' | sort -V | tail -1)"
          test -n "$selected_xcode"
          echo "DEVELOPER_DIR=$selected_xcode/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install existing pinned NativeScript tooling
        run: npm ci --prefix Scripts/NativeScript --ignore-scripts --no-audit --no-fund
      - name: Compare real SDK metadata parser modes
        run: python3 Scripts/NativeScript/probe-sdk-metadata.py
      - name: Retain actual SDK probe evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nativescript-sdk-metadata
          path: build/acceptance/nativescript-sdk-probe
          if-no-files-found: error
          retention-days: 14
