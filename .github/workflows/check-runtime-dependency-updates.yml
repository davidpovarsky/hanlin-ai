name: Check RuntimeCore Dependency Updates
run-name: Upstream ${{ inputs.operation || 'renovate' }} PR${{ inputs.candidate_pr || 'none' }} ${{ inputs.dispatch_token || github.run_id }}

on:
  workflow_call:
    inputs:
      dispatch_token:
        type: string
        default: ''
      package_name:
        type: string
        default: ''
      operation:
        type: string
        required: true
      candidate_pr:
        type: string
        required: true
      runtime_baseline_run_id:
        type: string
        default: '42926628418'
        required: false
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
    inputs:
      dispatch_token:
        description: Caller correlation recorded in the actual run identity
        type: string
        default: ''
      package_name:
        description: Optional single original dependency for scoped Renovate acceptance
        type: string
        default: ''
      operation:
        description: Scoped upstream operation; no merge or distribution
        type: choice
        options: [audit, renovate, candidate, failure-demo, swiftpm-candidate, swiftpm-pin-only, native-candidate]
        default: audit
      candidate_pr:
        description: Same-repository isolated Host update PR (candidate/failure-demo)
        type: string
        default: ''
      runtime_baseline_run_id:
        description: Existing verified RuntimeCore artifact origin for unchanged native inputs
        type: string
        default: '42926628418'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: runtime-core-update-check
  cancel-in-progress: false

jobs:
  update-and-verify:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'native-candidate'
    name: Pin, build, test, and propose RuntimeCore updates
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      HOST_ROOT: AI_HLY/Downstream/RuntimeCore/Node/Host
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout protected branch without modifying it
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up pinned Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.5.0
          cache: npm
          cache-dependency-path: AI_HLY/Downstream/RuntimeCore/Node/Host/package-lock.json

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Resolve exact supported upstream releases
        id: update
        run: |
          set -euo pipefail
          cp RuntimeDependencies.lock.json "$RUNNER_TEMP/baseline-lock.json"
          baseline_hash="$(node Scripts/Runtime/compute-runtime-dependency-hash.mjs "$RUNNER_TEMP/baseline-lock.json")"
          echo "baseline_hash=$baseline_hash" >> "$GITHUB_OUTPUT"

          npm ci --ignore-scripts --no-audit --no-fund --prefix "$HOST_ROOT"
          node Scripts/Runtime/update-runtime-dependencies.mjs --include-native --allow-major
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix "$HOST_ROOT"
          node Scripts/Runtime/update-runtime-dependencies.mjs \
            RuntimeDependencies.lock.json "$HOST_ROOT/package.json" "$HOST_ROOT/package-lock.json" \
            --sync-package-lock
          node Scripts/Runtime/generate-runtime-manifest.mjs
          node Scripts/Runtime/validate-runtime-lock.mjs RuntimeDependencies.lock.json --allow-pending-build

          if git diff --quiet -- RuntimeDependencies.lock.json "$HOST_ROOT/package.json" "$HOST_ROOT/package-lock.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All supported RuntimeCore dependencies are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Live Activity · refresh
        if: steps.update.outputs.changed == 'true'
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Test updated host dependency graph
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$HOST_ROOT"
          npm test --prefix "$HOST_ROOT"
          node Scripts/Runtime/validate-runtime-localization.mjs

      - name: Live Activity · refresh
        if: steps.update.outputs.changed == 'true'
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Create isolated update branch
        if: steps.update.outputs.changed == 'true'
        id: branch
        run: |
          set -euo pipefail
          branch="codex/runtime-core-dependencies-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add RuntimeDependencies.lock.json "$HOST_ROOT/package.json" "$HOST_ROOT/package-lock.json" \
            AI_HLY/Downstream/RuntimeCore/Resources/RuntimeManifest.json
          git commit -m "Update pinned RuntimeCore dependencies"
          git push --set-upstream origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Live Activity · refresh
        if: steps.update.outputs.changed == 'true'
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build immutable candidate runtime artifact (no release)
        if: steps.update.outputs.changed == 'true'
        id: runtime
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          gh workflow run build-runtime-bundle.yml --ref "$BRANCH" \
            -f publish_release=false -f force_rebuild=false -f reuse_artifacts_run_id=''
          for attempt in {1..30}; do
            run_id="$(gh run list --workflow build-runtime-bundle.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "${run_id:-}" || { echo "Runtime build dispatch was not found." >&2; exit 1; }
          gh run watch "$run_id" --interval 60 --exit-status
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Live Activity · refresh
        if: steps.update.outputs.changed == 'true'
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Finalize verified runtime checksums
        if: steps.update.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          dependency_hash="$(node Scripts/Runtime/compute-runtime-dependency-hash.mjs RuntimeDependencies.lock.json)"
          release_tag="runtime-core-v1-${dependency_hash}"
          mkdir -p "$RUNNER_TEMP/runtime-release"
          gh run download "${{ steps.runtime.outputs.run_id }}" \
            --name "hanlin-runtime-bundle-${dependency_hash}" --dir "$RUNNER_TEMP/runtime-release"
          (cd "$RUNNER_TEMP/runtime-release" && sha256sum -c runtime-bundle.sha256)
          bundle_sha="$(awk 'NR == 1 {print $1}' "$RUNNER_TEMP/runtime-release/runtime-bundle.sha256")"
          node_sha="$(awk 'NR == 1 {print $1}' "$RUNNER_TEMP/runtime-release/node-xcframework.sha256")"
          node - "$bundle_sha" "$node_sha" <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('RuntimeDependencies.lock.json', 'utf8'));
          lock.runtimeBundle.sha256 = process.argv[2];
          lock.runtimeBundle.verificationStatus = 'verified';
          lock.node.xcframeworkSha256 = process.argv[3];
          lock.node.verificationStatus = 'verified';
          fs.writeFileSync('RuntimeDependencies.lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          node Scripts/Runtime/generate-runtime-manifest.mjs
          node Scripts/Runtime/validate-runtime-lock.mjs
          git add RuntimeDependencies.lock.json AI_HLY/Downstream/RuntimeCore/Resources/RuntimeManifest.json
          git commit -m "Record verified RuntimeCore binary checksums"
          git push origin "$BRANCH"

      - name: Live Activity · refresh
        if: steps.update.outputs.changed == 'true'
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build the candidate app and unsigned IPA
        if: steps.update.outputs.changed == 'true'
        id: app
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          gh workflow run build-ios26-unsigned-ipa.yml --ref "$BRANCH" \
            -f testflight_upload=false -f runtime_publish_release=false \
            -f runtime_bundle_artifact_run_id="${{ steps.runtime.outputs.run_id }}"
          for attempt in {1..30}; do
            run_id="$(gh run list --workflow build-ios26-unsigned-ipa.yml --branch "$BRANCH" \
              --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "${run_id:-}" || { echo "IPA build dispatch was not found." >&2; exit 1; }
          gh run watch "$run_id" --interval 60 --exit-status
          mkdir -p "$RUNNER_TEMP/candidate-ipa"
          gh run download "$run_id" --name AI_Hanlin-iOS26-unsigned-ipa --dir "$RUNNER_TEMP/candidate-ipa"
          ipa_size="$(find "$RUNNER_TEMP/candidate-ipa" -name '*.ipa' -type f -exec stat -c '%s' {} \; | head -1)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$ipa_size" >> "$GITHUB_OUTPUT"

      - name: Live Activity · refresh
        if: steps.update.outputs.changed == 'true'
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Open update pull request with provenance and size evidence
        if: steps.update.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          RUNTIME_RUN: ${{ steps.runtime.outputs.run_id }}
          APP_RUN: ${{ steps.app.outputs.run_id }}
          IPA_SIZE: ${{ steps.app.outputs.ipa_size }}
          BASELINE_HASH: ${{ steps.update.outputs.baseline_hash }}
        run: |
          set -euo pipefail
          dependency_hash="$(node Scripts/Runtime/compute-runtime-dependency-hash.mjs RuntimeDependencies.lock.json)"
          release_tag="runtime-core-v1-${dependency_hash}"
          old_tag="runtime-core-v1-${BASELINE_HASH}"
          new_size="$(find "$RUNNER_TEMP/runtime-release" -name 'hanlin-runtime-*.zip' -type f -exec stat -c '%s' {} \; | head -1)"
          old_size="$(gh release view "$old_tag" --json assets --jq \
            ".assets[] | select(.name == \"hanlin-runtime-${BASELINE_HASH}.zip\") | .size" 2>/dev/null || echo 0)"
          delta=$((new_size - old_size))
          node - <<'NODE' > "$RUNNER_TEMP/versions.txt"
          const lock = require('./RuntimeDependencies.lock.json');
          console.log(`- Node: ${lock.node.version} (${lock.node.commit})`);
          console.log(`- Python: ${lock.python.version} (${lock.python.release})`);
          console.log(`- TypeScript: ${lock.typescript.version}`);
          console.log(`- ios_system: ${lock.iosSystem.release} (${lock.iosSystem.commit})`);
          console.log(`- Runtime bundle SHA-256: ${lock.runtimeBundle.sha256}`);
          console.log(`- Node XCFramework SHA-256: ${lock.node.xcframeworkSha256}`);
          NODE
          {
            echo 'Automated RuntimeCore update candidate. No automatic merge is enabled.'
            echo "Maintained dependency base: ${{ github.ref_name }} @ ${{ github.sha }}"
            echo
            cat "$RUNNER_TEMP/versions.txt"
            echo
            echo "- Runtime build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUNTIME_RUN}"
            echo "- App/IPA build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${APP_RUN}"
            echo "- Candidate unsigned IPA size: ${IPA_SIZE} bytes"
            echo "- Runtime bundle size: ${new_size} bytes (delta ${delta} bytes)"
            echo '- Host tests, lock validation, localization validation, runtime smoke tests, and the Xcode app build passed.'
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
            --title 'Update pinned RuntimeCore dependencies' --body-file "$RUNNER_TEMP/pr-body.md"

  upstream:
    name: Hanlin upstream acceptance
    if: inputs.operation != 'native-candidate' && inputs.operation != 'swiftpm-candidate' && inputs.operation != 'swiftpm-pin-only'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      UPDATE_OPERATION: ${{ inputs.operation || 'renovate' }}
      CANDIDATE_PR: ${{ inputs.candidate_pr }}
      UPSTREAM_PACKAGE: ${{ inputs.package_name }}
      UPSTREAM_RUNTIME_BASELINE_RUN_ID: ${{ inputs.runtime_baseline_run_id || '42926628418' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: Scripts/Runtime/DependencyUpdates/package-lock.json
      - name: Preflight actual automation toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/upstream-updates
          { sw_vers; uname -m; xcodebuild -version; node --version; npm --version; df -h .; } > build/upstream-updates/preflight.log
      - name: Install pinned updater tooling
        working-directory: Scripts/Runtime/DependencyUpdates
        run: |
          npm ci --ignore-scripts --workspaces=false --no-audit --no-fund
          npm rebuild re2 --foreground-scripts --workspaces=false
          npm sbom --sbom-format cyclonedx > ../../../build/upstream-updates/tooling-sbom.json
      - name: Validate actual Renovate configuration
        run: node Scripts/Runtime/DependencyUpdates/node_modules/renovate/dist/config-validator.js --strict .renovaterc.json
      - name: Test updater, drift and merge policy
        run: |
          node --test Scripts/Runtime/Tests/dependency-updates.test.mjs
          node --test Scripts/Runtime/Tests/upstream-host-accounting.test.mjs
          node --test Scripts/Runtime/Tests/upstream-run-consumer.test.mjs Scripts/Runtime/Tests/upstream-check-lineage.test.mjs
          python3 Scripts/Runtime/Tests/test_upstream_proof_reader.py
      - name: Inventory actual tracked graphs
        run: node Scripts/Runtime/inventory-upstream-dependencies.mjs
      - name: Audit supported upstream releases without editing pins
        if: env.UPDATE_OPERATION == 'audit' || env.UPDATE_OPERATION == 'renovate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd AI_HLY/Downstream/RuntimeCore/Node/Host && npm ci --ignore-scripts --workspaces=false --no-audit --no-fund)
          node Scripts/Runtime/update-runtime-dependencies.mjs --plan --include-native --report=build/upstream-updates/plan.json
      - name: Run the single configured Renovate bot
        if: env.UPDATE_OPERATION == 'renovate'
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_BASE_BRANCH_PATTERNS: ${{ github.ref_name }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: ignored
          RENOVATE_ALLOW_SCRIPTS: 'false'
          RENOVATE_BINARY_SOURCE: global
          LOG_FILE: build/upstream-updates/renovate.log
        run: node Scripts/Runtime/run-upstream-bot.mjs "${{ github.repository }}" "${{ github.ref_name }}" apply "$UPSTREAM_PACKAGE"
      - name: Authenticate candidate diff and upstream source pins
        if: env.UPDATE_OPERATION == 'candidate' || env.UPDATE_OPERATION == 'failure-demo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node Scripts/Runtime/prepare-upstream-verification.mjs "${{ github.repository }}" "$CANDIDATE_PR"
      - name: Reproduce real failure gate on the candidate
        if: env.UPDATE_OPERATION == 'failure-demo'
        run: |
          echo 'Intentional negative acceptance demonstration: merge gate must reject this actual failed run.'
          exit 1
      - name: Select actual embedded Host engine for candidate validation
        if: env.UPDATE_OPERATION == 'candidate'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.5.0'
      - name: Authenticate and stage the unchanged native binary origin
        if: env.UPDATE_OPERATION == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_CORE_ARTIFACT_RUN_ID: ${{ inputs.runtime_baseline_run_id }}
        run: |
          node Scripts/Runtime/upstream-host-accounting.mjs capture native-origin
          python3 Scripts/Runtime/runtime_native_identity.py --verify-reuse
          bash Scripts/Runtime/prepare-runtime-core.sh 2>&1 | tee build/upstream-updates/native-origin.log
      - name: Prepare Host artifact or verify its same-run reuse
        id: host-closure
        if: env.UPDATE_OPERATION == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.5.0'
          node Scripts/Runtime/upstream-host-accounting.mjs capture host
          bash Scripts/Runtime/prepare-runtime-host.sh 2>&1 | tee build/upstream-updates/host.log
          node Scripts/Runtime/validate-runtime-lock.mjs
          cp build/runtime-host/host-metadata.json build/upstream-updates/host-metadata.json
      - name: Generate source lock SBOM and complete candidate receipt
        if: env.UPDATE_OPERATION == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          (cd AI_HLY/Downstream/RuntimeCore/Node/Host && npm sbom --package-lock-only --omit=dev --sbom-format cyclonedx) > build/upstream-updates/host-sbom.json
          node Scripts/Runtime/record-upstream-receipt.mjs
      - name: Preserve complete candidate Host artifact
        if: always() && env.UPDATE_OPERATION == 'candidate' && steps.host-closure.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: upstream-host-${{ github.run_id }}
          path: build/runtime-host
          if-no-files-found: error
          retention-days: 14
      - name: Retain original evidence even on failed/blocked verification
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: upstream-proof-${{ github.run_id }}
          path: build/upstream-updates
          if-no-files-found: error
          retention-days: 14

  swiftpm:
    name: Hanlin SwiftPM upstream acceptance
    if: inputs.operation == 'swiftpm-candidate' || inputs.operation == 'swiftpm-pin-only'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify authoritative SwiftPM manifest constraints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/upstream-updates
          python3 Scripts/Runtime/Tests/test_swiftpm_pin.py 2>&1 | tee build/upstream-updates/pin-semantic-tests.log
          python3 Scripts/Runtime/verify-swiftpm-pin.py Packages/HanlinSkillFormat 6.2.2 jpsim/Yams a27b21e0c81c5bf42049b897a62aaf387e80f279 > build/upstream-updates/pin-semantic-receipt.json
      - name: Execute actual pinned SwiftPM baseline and candidate
        if: inputs.operation == 'swiftpm-candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Scripts/Runtime/verify-swiftpm-update.py "${{ github.repository }}" "${{ inputs.candidate_pr }}"
      - name: Retain original SwiftPM evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: upstream-swiftpm-proof-${{ github.run_id }}
          path: build/upstream-updates
          if-no-files-found: error
          retention-days: 14
