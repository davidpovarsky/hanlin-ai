name: Build Signed ChavrusaChat IPA and Upload to TestFlight

on:
  workflow_call:
    inputs:
      upload_to_testflight:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Validate and upload the exported IPA to App Store Connect
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: chavrusachat-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_PATH: AI_HLY.xcodeproj
  SCHEME: AI_HLY
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APP_BUNDLE_ID: com.itorah.chavrusachat
  SHARE_BUNDLE_ID: com.itorah.chavrusachat.share
  WIDGETS_BUNDLE_ID: com.itorah.chavrusachat.widgets
  TRANSLATION_BUNDLE_ID: com.itorah.chavrusachat.translation-provider
  NOTIFICATION_BUNDLE_ID: com.itorah.chavrusachat.notification-service
  PRIVATE_APP_GROUP: group.com.itorah.chavrusachat
  SHARED_APP_GROUP: group.com.itorah.shared
  ICLOUD_CONTAINER: iCloud.com.itorah.chavrusachat
  BUILD_DIR: ${{ github.workspace }}/build/signed-ios

jobs:
  build-sign-and-upload:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Select newest stable Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print \
            | grep -E '/Xcode_26([._][0-9]+)*\.app$' | sort -V | tail -1)"
          test -n "$selected_xcode"
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0

      - name: Compute build number and prepare folders
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          mkdir -p "$BUILD_DIR/logs"
          echo "Using CFBundleVersion $build_number"

      - name: Prepare application build inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > Config.xcconfig <<'EOF'
          // Generated by GitHub Actions. Do not commit secrets here.
          HANLIN_API_KEY =
          HANLIN_OPEN_API_KEY =
          EOF
          npm ci --ignore-scripts --no-audit --no-fund --prefix Scripts/NativeScript
          npm run prepare:ios-dependencies --prefix Scripts/NativeScript
          node Scripts/NativeScript/prepare-fixture.mjs
          npm run preflight:ios-dependencies --prefix Scripts/NativeScript
          bash Scripts/Runtime/prepare-runtime-core.sh
          npm ci --ignore-scripts --no-audit --no-fund --prefix Scripts/ScriptingCompiler
          npm ci --ignore-scripts --no-audit --no-fund --prefix AI_HLY/Downstream/RuntimeCore/Node/Host
          npm run test:production --prefix Scripts/ScriptingCompiler
          rm -rf AI_HLY/Downstream/RuntimeCore/Node/Host/node_modules
          bash Scripts/Runtime/prepare-runtime-host.sh
          cp build/runtime-host/RuntimeHostResources.zip AI_HLY/RuntimeHostResources.zip
          bash Scripts/Runtime/preflight-runtime-core.sh

      - name: Restore App Store Connect API key
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID_VALUE: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_VALUE: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          for required in ASC_KEY_P8_B64 ASC_KEY_ID_VALUE ASC_ISSUER_ID_VALUE; do
            test -n "${!required:-}" || { echo "::error::Missing signing secret $required"; exit 1; }
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/.private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_VALUE}.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$key_path"
          cp "$key_path" "$HOME/.private_keys/AuthKey_${ASC_KEY_ID_VALUE}.p8"
          chmod 600 "$key_path" "$HOME/.private_keys/AuthKey_${ASC_KEY_ID_VALUE}.p8"
          echo "ASC_KEY_ID=$ASC_KEY_ID_VALUE" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_VALUE" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Import distribution certificate and provisioning profiles
        shell: bash
        env:
          CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MAIN_PROFILE_B64: ${{ secrets.APPLE_MAIN_PROVISIONING_PROFILE_B64 }}
          SHARE_PROFILE_B64: ${{ secrets.APPLE_SHARE_PROVISIONING_PROFILE_B64 }}
          WIDGETS_PROFILE_B64: ${{ secrets.APPLE_WIDGETS_PROVISIONING_PROFILE_B64 }}
          TRANSLATION_PROFILE_B64: ${{ secrets.APPLE_TRANSLATION_PROVISIONING_PROFILE_B64 }}
          NOTIFICATION_PROFILE_B64: ${{ secrets.APPLE_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_B64 }}
        run: |
          set -Eeuo pipefail
          for required in TEAM_ID CERTIFICATE_B64 CERTIFICATE_PASSWORD MAIN_PROFILE_B64 SHARE_PROFILE_B64 WIDGETS_PROFILE_B64 TRANSLATION_PROFILE_B64 NOTIFICATION_PROFILE_B64; do
            test -n "${!required:-}" || { echo "::error::Missing signing secret $required"; exit 1; }
          done

          keychain="$RUNNER_TEMP/chavrusachat-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/apple-distribution.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep 'Apple Distribution'

          install_profile() {
            local role="$1" bundle_id="$2" encoded="$3" env_prefix="$4"
            local profile="$RUNNER_TEMP/${role}.mobileprovision"
            local plist="$BUILD_DIR/logs/${role}-profile.plist"
            printf '%s' "$encoded" | base64 --decode > "$profile"
            security cms -D -i "$profile" > "$plist"
            local uuid name team app_identifier get_task_allow groups
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
            team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist")
            app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")
            get_task_allow=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$plist")
            test "$team" = "$TEAM_ID"
            test "$app_identifier" = "$TEAM_ID.$bundle_id"
            test "$get_task_allow" = false
            ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" >/dev/null 2>&1
            ! /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$plist" >/dev/null 2>&1
            groups=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$plist")
            grep -Fq "$PRIVATE_APP_GROUP" <<< "$groups"
            grep -Fq "$SHARED_APP_GROUP" <<< "$groups"
            if [ "$bundle_id" = "$APP_BUNDLE_ID" ]; then
              local containers services
              containers=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers' "$plist")
              services=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-services' "$plist")
              grep -Fq "$ICLOUD_CONTAINER" <<< "$containers"
              if [ "$services" != "*" ]; then
                grep -Fq CloudDocuments <<< "$services"
                grep -Fq CloudKit <<< "$services"
              fi
              test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$plist")" = production
            fi
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "${env_prefix}_PROFILE_SPECIFIER=$name" >> "$GITHUB_ENV"
            echo "${env_prefix}_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
            echo "Installed $role App Store profile ($uuid)"
          }

          install_profile main "$APP_BUNDLE_ID" "$MAIN_PROFILE_B64" MAIN
          install_profile share "$SHARE_BUNDLE_ID" "$SHARE_PROFILE_B64" SHARE
          install_profile widgets "$WIDGETS_BUNDLE_ID" "$WIDGETS_PROFILE_B64" WIDGETS
          install_profile translation "$TRANSLATION_BUNDLE_ID" "$TRANSLATION_PROFILE_B64" TRANSLATION
          install_profile notification "$NOTIFICATION_BUNDLE_ID" "$NOTIFICATION_PROFILE_B64" NOTIFICATION
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Resolve package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$BUILD_DIR/SourcePackages" \
            -skipPackagePluginValidation -skipMacroValidation

      - name: Verify signing settings for every distributed target
        shell: bash
        run: |
          set -euo pipefail
          check_target() {
            local target="$1" bundle_id="$2" profile="$3" entitlements="$4"
            local log="$BUILD_DIR/logs/${target}-settings.log"
            xcodebuild -project "$PROJECT_PATH" -target "$target" -configuration Release \
              -destination 'generic/platform=iOS' CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              -showBuildSettings | tee "$log"
            grep -E "^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = $bundle_id$" "$log"
            grep -E "^[[:space:]]*DEVELOPMENT_TEAM = $TEAM_ID$" "$log"
            grep -F "PROVISIONING_PROFILE_SPECIFIER = $profile" "$log"
            grep -F "CODE_SIGN_ENTITLEMENTS = $entitlements" "$log"
          }
          check_target AI_Hanlin "$APP_BUNDLE_ID" "$MAIN_PROFILE_SPECIFIER" AI_HLY/AI_HLY.entitlements
          check_target ChavrusaChatShare "$SHARE_BUNDLE_ID" "$SHARE_PROFILE_SPECIFIER" ChavrusaChatShare/ChavrusaChatShare.entitlements
          check_target HanlinScriptingWidgets "$WIDGETS_BUNDLE_ID" "$WIDGETS_PROFILE_SPECIFIER" HanlinScriptingWidgets/HanlinScriptingWidgets.entitlements
          check_target ChavrusaChatTranslationProvider "$TRANSLATION_BUNDLE_ID" "$TRANSLATION_PROFILE_SPECIFIER" ChavrusaChatTranslationProvider/ChavrusaChatTranslationProvider.entitlements
          check_target ChavrusaChatNotificationService "$NOTIFICATION_BUNDLE_ID" "$NOTIFICATION_PROFILE_SPECIFIER" ChavrusaChatNotificationService/ChavrusaChatNotificationService.entitlements

      - name: Archive signed Release app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$BUILD_DIR/ChavrusaChat.xcarchive" \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            -clonedSourcePackagesDirPath "$BUILD_DIR/SourcePackages" \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$BUILD_DIR/logs/archive.log"

      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>$APP_BUNDLE_ID</key><string>$MAIN_PROFILE_SPECIFIER</string>
              <key>$SHARE_BUNDLE_ID</key><string>$SHARE_PROFILE_SPECIFIER</string>
              <key>$WIDGETS_BUNDLE_ID</key><string>$WIDGETS_PROFILE_SPECIFIER</string>
              <key>$TRANSLATION_BUNDLE_ID</key><string>$TRANSLATION_PROFILE_SPECIFIER</string>
              <key>$NOTIFICATION_BUNDLE_ID</key><string>$NOTIFICATION_PROFILE_SPECIFIER</string>
            </dict>
          </dict></plist>
          PLIST
          plutil -lint "$export_options"
          mkdir -p "$BUILD_DIR/export"
          xcodebuild -exportArchive \
            -archivePath "$BUILD_DIR/ChavrusaChat.xcarchive" \
            -exportPath "$BUILD_DIR/export" \
            -exportOptionsPlist "$export_options" \
            | tee "$BUILD_DIR/logs/export.log"
          raw_ipa=$(find "$BUILD_DIR/export" -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -s "$raw_ipa"
          final_ipa="$BUILD_DIR/export/ChavrusaChat-$BUILD_NUMBER.ipa"
          mv "$raw_ipa" "$final_ipa"
          echo "IPA_PATH=$final_ipa" >> "$GITHUB_ENV"
          shasum -a 256 "$final_ipa" | tee "$final_ipa.sha256"

      - name: Verify archive, signatures, profiles, and entitlements
        shell: bash
        run: |
          set -Eeuo pipefail
          verify_dir="$RUNNER_TEMP/verify-ipa"
          ditto -x -k "$IPA_PATH" "$verify_dir"
          app=$(find "$verify_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "$APP_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = ChavrusaChat
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD_NUMBER"
          codesign --verify --deep --strict --verbose=2 "$app"

          verify_bundle() {
            local bundle="$1" expected_id="$2" role="$3"
            local entitlements="$BUILD_DIR/logs/${role}-signed-entitlements.plist"
            local profile="$BUILD_DIR/logs/${role}-embedded-profile.plist"
            codesign --display --entitlements - --xml "$bundle" > "$entitlements"
            security cms -D -i "$bundle/embedded.mobileprovision" > "$profile"
            test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$entitlements")" = "$TEAM_ID"
            test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$entitlements")" = "$TEAM_ID.$expected_id"
            test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile")" = "$TEAM_ID.$expected_id"
            local groups
            groups=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$entitlements")
            grep -Fq "$PRIVATE_APP_GROUP" <<< "$groups"
            grep -Fq "$SHARED_APP_GROUP" <<< "$groups"
          }

          verify_bundle "$app" "$APP_BUNDLE_ID" main
          declare -A extensions=(
            [share]="ChavrusaChatShare.appex|$SHARE_BUNDLE_ID"
            [widgets]="HanlinScriptingWidgets.appex|$WIDGETS_BUNDLE_ID"
            [translation]="ChavrusaChatTranslationProvider.appex|$TRANSLATION_BUNDLE_ID"
            [notification]="ChavrusaChatNotificationService.appex|$NOTIFICATION_BUNDLE_ID"
          )
          for role in "${!extensions[@]}"; do
            IFS='|' read -r bundle_name bundle_id <<< "${extensions[$role]}"
            bundle="$app/PlugIns/$bundle_name"
            test -d "$bundle"
            codesign --verify --strict --verbose=2 "$bundle"
            verify_bundle "$bundle" "$bundle_id" "$role"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Info.plist")" = "$BUILD_NUMBER"
          done

          main_entitlements="$BUILD_DIR/logs/main-signed-entitlements.plist"
          containers=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers' "$main_entitlements")
          services=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-services' "$main_entitlements")
          grep -Fq "$ICLOUD_CONTAINER" <<< "$containers"
          grep -Fq CloudDocuments <<< "$services"
          grep -Fq CloudKit <<< "$services"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$main_entitlements")" = production
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.siri' "$main_entitlements")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.translation-app' "$main_entitlements")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.weatherkit' "$main_entitlements")" = true
          echo "Signed IPA verification passed for the app and all four extensions"

      - name: Validate with App Store Connect
        if: ${{ inputs.upload_to_testflight }}
        run: xcrun altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect and TestFlight
        if: ${{ inputs.upload_to_testflight }}
        run: xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Verify uploaded build appears in TestFlight
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet 'PyJWT[crypto]==2.10.1'
          "$RUNNER_TEMP/asc-venv/bin/python" Scripts/CI/verify_testflight_build.py "$BUILD_NUMBER"

      - name: Upload signed IPA and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChavrusaChat-signed-ipa-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.IPA_PATH }}.sha256
            ${{ env.BUILD_DIR }}/ChavrusaChat.xcarchive/dSYMs
            ${{ env.BUILD_DIR }}/logs
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          for uuid in "${MAIN_PROFILE_UUID:-}" "${SHARE_PROFILE_UUID:-}" "${WIDGETS_PROFILE_UUID:-}" "${TRANSLATION_PROFILE_UUID:-}" "${NOTIFICATION_PROFILE_UUID:-}"; do
            if [ -n "$uuid" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"; fi
          done
          rm -f "${ASC_KEY_PATH:-$RUNNER_TEMP/missing-asc-key}"
          rm -f "$HOME/.private_keys/AuthKey_${ASC_KEY_ID:-missing}.p8"
